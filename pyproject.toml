[project]
name = "sol-o"
version = "0.1.0"
description = "Solar-system multi-agent orchestrator"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
