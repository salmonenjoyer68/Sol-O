[package]
name = "sol-o"
version = "0.1.0"
edition = "2021"
description = "Solar-system multi-agent orchestrator"

[lib]
name = "sol_o"
path = "src/lib.rs"

[[bin]]
name = "sol-o"
path = "src/main.rs"

[dependencies]
axum = "0.8"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
async-stream = "0.3"
futures-core = "0.3"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "boot"
path = "rust-tests/boot.rs"

[[test]]
name = "stream"
path = "rust-tests/stream.rs"

[[test]]
name = "run"
path = "rust-tests/run.rs"

[[test]]
name = "orchestrate"
path = "rust-tests/orchestrate.rs"

[[test]]
name = "approvals"
path = "rust-tests/approvals.rs"

[[test]]
name = "toolbox"
path = "rust-tests/toolbox.rs"

[[test]]
name = "cli"
path = "rust-tests/cli.rs"
