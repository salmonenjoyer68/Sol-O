<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sol-O · Solar Orchestrator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #0c0b09;
    --deep: #080706;
    --surface: #13110e;
    --fg: #ece7dc;
    --muted: #a39a89;
    --border: rgba(236, 231, 220, 0.13);
    --accent: #e9b45c;
    --success: #8cc79d;
    --warning: #e0a35c;
    --error: #e28372;
    --info: #8fb3d9;
    --ok: var(--success);
    --bad: var(--error);
    --radius: 2px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --dur-fast: 120ms;
    --dur-slow: 240ms;
    --header-h: 56px;
    /* Measured height of the command dock the sheet and drawer stack above. */
    --dock-h: 76px;
    --font-ui: "Space Grotesk", "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: var(--font-ui); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  body { overflow: hidden; }
  a:link, a:visited { color: inherit; }
  button, input, select, textarea { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  canvas#sky { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; z-index: 0; }

  /* One full-viewport console: header, feed rail, stage, planet rail, dock. */
  #app {
    position: relative; z-index: 1;
    height: 100vh; display: grid;
    grid-template-columns: clamp(320px, 28vw, 400px) minmax(0, 1fr) 300px;
    grid-template-rows: var(--header-h) minmax(0, 1fr) auto auto;
    grid-template-areas:
      "bar bar bar"
      "feed stage roster"
      "out stage roster"
      "dock dock dock";
    /* The empty stage is the canvas's mouse target; only the chrome takes clicks. */
    pointer-events: none;
  }
  #bar, #log, #roster, #output, #cmdbar, #sheet, #panel, #approval { pointer-events: auto; }
  #stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; }

  /* Header: the single bar; absorbs the old product bar. */
  #bar {
    grid-area: bar; min-width: 0;
    display: flex; align-items: center; gap: 12px;
    padding: 0 16px;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  #bar .wordmark {
    flex: none; font-weight: 700; font-size: 14px; letter-spacing: 0.24em;
    text-transform: uppercase; color: var(--fg); white-space: nowrap;
  }
  #bar .caption {
    flex: none; padding-left: 12px; border-left: 1px solid var(--border);
    font-size: 10px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted); white-space: nowrap;
  }
  #bar .replay-bar { margin-left: auto; display: flex; align-items: center; gap: 8px; min-width: 0; }
  #replay-controls { display: flex; align-items: center; gap: 6px; }
  #replay-controls button {
    height: 28px; padding: 0 10px; font-size: 12px; font-variant-numeric: tabular-nums;
  }
  #replay-pause { min-width: 66px; }
  #replay-pause[aria-pressed="true"] { border-color: rgba(233, 180, 92, 0.55); color: var(--accent); }
  select#replay {
    height: 32px; max-width: 250px; min-width: 0; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--bg); color: var(--fg);
    font-size: 12px; padding: 0 8px;
  }

  /* Bottom command dock: presets, task input, Run. */
  #cmdbar {
    grid-area: dock;
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto;
    grid-template-areas: "presets task count run";
    align-items: center; gap: 16px; padding: 12px 16px;
    background: var(--surface); border-top: 1px solid var(--border);
  }
  #presets { grid-area: presets; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #presets .chip {
    flex: none; height: 28px; padding: 0 10px; border-radius: var(--radius); font-size: 12px;
    font-weight: 500; color: var(--muted); background: transparent; white-space: nowrap;
  }
  #plan-count {
    grid-area: count; justify-self: end; font-family: var(--font-mono);
    font-size: 11.5px; letter-spacing: 0.04em; color: var(--muted); white-space: nowrap;
  }
  #task {
    grid-area: task; width: 100%; height: 38px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--bg);
    color: var(--fg); padding: 0 12px; font-size: 14px;
  }
  #task:focus { border-color: rgba(233, 180, 92, 0.55); }
  #task::placeholder { color: var(--muted); }
  button {
    height: 32px; border-radius: var(--radius); border: 1px solid var(--border);
    background: transparent; color: var(--fg); font-size: 12px;
    font-weight: 600; letter-spacing: 0.04em; padding: 0 12px; cursor: pointer;
    transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
  }
  button:hover { border-color: rgba(233, 180, 92, 0.5); background: rgba(236, 231, 220, 0.04); }
  button:active { transform: translateY(1px); }
  /* The Run action is the only solid accent surface on the page. */
  #run {
    grid-area: run; height: 38px; padding: 0 22px; font-size: 13px;
    background: var(--accent); border-color: var(--accent); color: #17130c;
    font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  }
  #run:hover { background: #f0c271; border-color: #f0c271; }
  .pill {
    flex: none; height: 26px; display: inline-flex; align-items: center; padding: 0 10px;
    border-radius: var(--radius); font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--muted); white-space: nowrap;
  }
  .pill.planning { color: var(--info); border-color: rgba(143, 179, 217, 0.45); }
  .pill.working { color: var(--accent); border-color: rgba(233, 180, 92, 0.5); }
  .pill.complete { color: var(--success); border-color: rgba(140, 199, 157, 0.45); }
  .pill.failed { color: var(--error); border-color: rgba(226, 131, 114, 0.5); }
  .pill.awaiting { color: var(--warning); border-color: rgba(224, 163, 92, 0.55); }
  .pill.warn { color: var(--warning); border-color: rgba(224, 163, 92, 0.45); }

  /* Activity feed: left rail, newest line at the bottom. */
  #log {
    grid-area: feed; display: flex; flex-direction: column; min-height: 0;
    background: var(--surface);
    border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
    font-family: var(--font-mono); font-size: 11.5px; line-height: 1.6;
  }
  #log .head {
    flex: none; display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    color: var(--muted); letter-spacing: 0.18em; font-size: 10px; text-transform: uppercase;
  }
  #log .head button { height: 22px; padding: 0 8px; font-size: 12px; }
  #log-lines {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    scrollbar-width: thin; padding: 6px 0;
  }
  #log .line {
    display: flex; align-items: baseline; gap: 6px; padding: 3px 12px;
    color: var(--muted); white-space: nowrap;
  }
  #log .line time { flex: none; font-variant-numeric: tabular-nums; }
  #log .line .dot {
    flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--dot);
  }
  /* Only the name carries the agent accent; the tail stays muted for contrast. */
  #log .line .who { flex: none; font-weight: 600; color: var(--dot); }
  #log .line .what { overflow: hidden; text-overflow: ellipsis; }
  /* Status is carried by the dot, tint and text colour, never a side stripe. */
  #log .line.failed { background: rgba(226, 131, 114, 0.1); }
  #log .line.failed .what { color: #f0c4b9; }
  #log .line.done { background: rgba(140, 199, 157, 0.07); }
  #log .line.done .what { color: #cfe3d5; }

  /* Blocking gate: centred scrim above every panel and sheet. */
  #approval {
    position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
    padding: 16px; background: rgba(8, 7, 6, 0.72);
  }
  #approval .card {
    width: min(520px, 92vw); background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
  }
  #approval .label {
    color: var(--accent); font-size: 10px; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; margin-bottom: 8px;
  }
  #approval-preview {
    font-size: 13px; line-height: 1.55; color: var(--fg);
    white-space: pre-wrap; max-height: 84px; overflow: auto;
  }
  #approval .row { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
  /* Approve is the solid positive action; Reject stays quiet. */
  #approve { background: var(--success); border-color: var(--success); color: #0c0b09; }
  #approve:hover { background: #a3d6b2; border-color: #a3d6b2; }
  #reject { background: transparent; border-color: rgba(226, 131, 114, 0.5); color: var(--error); }
  #reject:hover { background: rgba(226, 131, 114, 0.08); border-color: var(--error); }
  /* Replayed gate is a read-only notice: no scrim, no modal, no decisions. */
  #approval.replay {
    inset: calc(var(--header-h) + 12px) 0 auto 0; padding: 0 16px;
    align-items: flex-start; background: none; pointer-events: none;
  }
  #approval.replay .card { pointer-events: auto; margin: 0 auto; }
  #approval.replay .row { display: none; }

  #tooltip {
    position: fixed; z-index: 35; pointer-events: none; max-width: 320px;
    padding: 8px 10px; border-radius: var(--radius); font-size: 12px; line-height: 1.45;
    color: var(--fg); background: var(--surface); border: 1px solid var(--border);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
  }
  #tooltip .tip-head { display: flex; align-items: baseline; gap: 8px; }
  #tooltip .tip-name { font-size: 12.5px; font-weight: 600; }
  #tooltip .tip-status {
    font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--tone, var(--muted));
  }
  #tooltip .tip-summary {
    display: block; margin-top: 4px; max-width: 280px;
    font-size: 11.5px; color: var(--muted);
  }
  #panel {
    /* Drawer: a fixed overlay on the right rail; the result stays left. */
    position: fixed; top: var(--header-h); right: 0; bottom: var(--dock-h);
    z-index: 30; width: 300px;
    display: flex; flex-direction: column;
    background: var(--surface); border-left: 1px solid var(--border);
  }
  #panel header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    font-size: 10px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted);
  }
  #panel-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #panel header button { height: 22px; width: 22px; padding: 0; font-size: 13px; line-height: 1; }
  #panel .chip {
    padding: 1px 8px; border-radius: var(--radius); border: 1px solid var(--border);
    font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted); white-space: nowrap;
  }
  #panel .chip.called { color: var(--info); border-color: rgba(143, 179, 217, 0.45); }
  #panel .chip.working { color: var(--accent); border-color: rgba(233, 180, 92, 0.5); }
  #panel .chip.done { color: var(--success); border-color: rgba(140, 199, 157, 0.45); }
  #panel .chip.failed {
    color: var(--error); border-color: rgba(226, 131, 114, 0.5);
    background: rgba(226, 131, 114, 0.1);
  }
  #panel-body { padding: 12px; overflow: auto; font-size: 12px; line-height: 1.55; color: var(--fg); }
  #panel .fields { margin: 0 0 12px; display: grid; gap: 8px; }
  #panel .fields div { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; }
  #panel dt {
    font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); padding-top: 2px;
  }
  #panel dd { margin: 0; color: var(--fg); white-space: pre-wrap; word-break: break-word; }
  #panel .out-label {
    display: block; margin-bottom: 6px; font-family: var(--font-mono); font-size: 10px;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
  }
  #panel pre {
    margin: 0; font-family: var(--font-mono); font-size: 11.5px; line-height: 1.55;
    color: var(--fg); white-space: pre-wrap; word-break: break-word;
  }

  /* Planet roster: one flat list in the right rail, no nested cards. */
  #roster {
    grid-area: roster; display: flex; flex-direction: column; min-height: 0;
    width: 300px; justify-self: end;
    background: var(--surface); border-left: 1px solid var(--border);
  }
  #roster .rh {
    flex: none; display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    font-size: 10px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--accent);
  }
  #roster .rh .count {
    font-family: var(--font-mono); font-size: 11.5px; font-weight: 400;
    letter-spacing: 0.04em; text-transform: none; color: var(--muted);
  }
  #roster-rows { overflow: auto; flex: 1; min-height: 0; }
  #roster .empty { margin: 0; padding: 12px; font-size: 12px; line-height: 1.55; color: var(--muted); }
  #roster .row {
    display: grid; grid-template-columns: 9px 1fr; gap: 10px; padding: 10px 12px;
    border-top: 1px solid var(--border); cursor: pointer;
  }
  #roster .row:first-child { border-top: 0; }
  #roster .row:hover { background: rgba(236, 231, 220, 0.04); }
  #roster .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  #roster .dot {
    width: 9px; height: 9px; margin-top: 5px; border-radius: 50%; background: var(--dot);
  }
  #roster .nm { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #roster .agent { font-size: 13px; font-weight: 600; }
  #roster .role {
    margin-top: 1px; font-size: 12px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #roster .chip {
    padding: 1px 8px; border-radius: var(--radius); border: 1px solid var(--border);
    font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted); white-space: nowrap;
  }
  #roster .chip.called { color: var(--info); border-color: rgba(143, 179, 217, 0.45); }
  #roster .chip.working { color: var(--accent); border-color: rgba(233, 180, 92, 0.5); }
  #roster .chip.done { color: var(--success); border-color: rgba(140, 199, 157, 0.45); }
  #roster .chip.failed {
    color: var(--error); border-color: rgba(226, 131, 114, 0.5);
    background: rgba(226, 131, 114, 0.1);
  }
  #roster .bar {
    margin-top: 7px; height: 3px; border-radius: var(--radius);
    background: rgba(236, 231, 220, 0.1); overflow: hidden;
  }
  #roster .bar i {
    display: block; height: 100%; width: 0; border-radius: var(--radius); background: var(--dot);
    transition: width var(--dur-slow) var(--ease);
  }
  #roster .row.failed .bar i { background: var(--error); }
  #roster .row.working .bar i {
    background: linear-gradient(90deg, transparent, var(--dot), transparent);
    background-size: 200% 100%; animation: roster-shimmer 1.2s linear infinite;
  }
  @keyframes roster-shimmer {
    from { background-position: 200% 0; }
    to { background-position: -100% 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    #roster .bar i { transition: none; }
    #roster .row.working .bar i { animation: none; }
  }
  #output {
    /* Result: the left rail's lower row, so the stage is never covered. */
    grid-area: out; display: flex; flex-direction: column; min-height: 0;
    max-height: min(46vh, 520px);
    background: var(--surface);
    border-right: 1px solid var(--border); border-top: 1px solid var(--border);
    animation: card-in var(--dur-slow) var(--ease);
  }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(8px); }
  }
  @media (prefers-reduced-motion: reduce) {
    #output { animation: none; }
  }
  #output header {
    flex: none; display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    font-size: 10px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted);
  }
  #output header button { height: 22px; width: 22px; padding: 0; font-size: 13px; line-height: 1; }
  #output-meta {
    flex: none; padding: 7px 12px 0; font-size: 11.5px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted); font-family: var(--font-mono);
  }
  #output-body {
    padding: 10px 12px 14px; overflow: auto; min-height: 0;
    white-space: pre-wrap; word-break: break-word;
    font-size: 14px; line-height: 1.6; color: var(--fg);
  }
  #output .actions { flex: none; display: flex; justify-content: flex-end; padding: 0 12px 12px; }
  #output .actions button { height: 30px; color: var(--accent); }
  #pill { cursor: pointer; }

  /* The roster and feed share one bottom sheet below 1180px; wider, the
     wrapper is transparent to the grid and they dock in their rails. */
  #sheet, #sheet-body { display: contents; }
  #sheet .sheet-head { display: none; }

  @media (max-width: 1179.98px) {
    #app {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas: "bar" "stage" "dock";
    }

    #bar { flex-wrap: wrap; padding: 8px 12px; gap: 8px; }
    #bar .caption { display: none; }
    #bar .replay-bar { flex: 1 1 100%; }
    select#replay { flex: 1 1 auto; max-width: none; min-width: 0; }

    #cmdbar {
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas: "presets count" "task run";
      gap: 8px; padding: 10px 12px;
    }

    #sheet {
      position: fixed; left: 8px; right: 8px; z-index: 28;
      bottom: calc(8px + var(--dock-h));
      display: flex; flex-direction: column; max-height: 50vh;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    #sheet .sheet-head { display: flex; align-items: center; gap: 6px; padding: 8px; }
    #sheet.open .sheet-head { border-bottom: 1px solid var(--border); }
    #sheet-toggle { flex: 1; min-width: 0; text-align: left; }
    #sheet .sheet-tabs { display: none; }
    #sheet.open .sheet-tabs { display: flex; gap: 6px; }
    #sheet .sheet-tabs button { height: 30px; padding: 0 12px; }
    #sheet .sheet-tabs button[aria-pressed="true"] { border-color: rgba(233, 180, 92, 0.55); color: var(--accent); }
    #sheet:not(.open) #sheet-body { display: none; }
    #sheet-body { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    #sheet[data-tab="roster"] #log,
    #sheet[data-tab="feed"] #roster { display: none; }

    /* Dock the rails into the sheet instead of the viewport. */
    #roster, #log {
      grid-area: auto; position: static; width: auto; max-height: none; min-height: 0; flex: 1;
      border: 0; background: transparent;
    }
    #log .head { display: none; }

    /* Result and drawer become full-screen sheets; the chrome steps aside. */
    #panel, #output {
      position: fixed; inset: 0; width: auto; max-width: none; max-height: none;
      border: 0; padding-bottom: env(safe-area-inset-bottom, 0);
    }
    #panel { z-index: 32; }
    #output { z-index: 34; }
    #output-body, #panel-body { padding-bottom: 24px; }
    body.modal-open #bar, body.modal-open #cmdbar, body.modal-open #sheet { display: none; }

    #approval { padding: 16px 12px calc(16px + env(safe-area-inset-bottom, 0)); }
    #approval .card { width: 100%; }
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true" tabindex="-1"></canvas>

<div id="app">
  <header id="bar">
    <span class="wordmark">Sol-O</span>
    <span class="caption">Solar orchestrator</span>
    <button type="button" id="pill" class="pill"><span id="pill-text" role="status">IDLE</span></button>
    <div class="replay-bar">
      <div id="replay-controls" class="hidden" role="group" aria-label="Replay controls">
        <button id="replay-pause" type="button" aria-pressed="false">Pause</button>
        <button id="replay-speed" type="button" aria-pressed="false" aria-label="Replay speed">1x</button>
      </div>
      <select id="replay" aria-label="Replay a stored run"><option value="">Replay a run…</option></select>
    </div>
  </header>

  <div id="stage" aria-hidden="true"></div>

  <div id="cmdbar" role="search" aria-label="Start a run">
    <input id="task" autocomplete="off" spellcheck="false" aria-label="Task"
           placeholder="Give the Sun a task…">
    <div id="presets" role="group" aria-label="Scenario presets">
      <button type="button" class="chip" data-task="Plan a three-day trip to Lisbon and write the itinerary.">Plan a trip</button>
      <button type="button" class="chip" data-task="Review this function for bugs and summarise the issues.">Review code</button>
      <button type="button" class="chip" data-task="Write a short report on what the team shipped this week.">Write a report</button>
    </div>
    <button id="run">Run</button>
    <span id="plan-count" class="hidden" aria-live="polite"></span>
  </div>

<div id="approval" class="hidden" role="dialog" aria-modal="true" aria-label="Approval required">

<script>
"use strict";

/* ------------------------------------------------------------------ */
/* Canvas setup                                                        */
/* ------------------------------------------------------------------ */

const canvas = document.getElementById("sky");
const ctx = canvas.getContext("2d");
const TAU = Math.PI * 2;
let W = window.innerWidth;
let H = window.innerHeight;
let stageRect = { left: 0, top: 0, width: W, height: H };
let CX = W / 2;
let CY = H / 2;

/* The Sun centres in the stage box between the rails, not in the viewport. */
function syncStage() {
  const box = document.getElementById("stage").getBoundingClientRect();
  stageRect = { left: box.left, top: box.top, width: box.width, height: box.height };
  CX = box.left + box.width / 2;
  CY = box.top + box.height / 2;
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  syncStage();
  makeBackground();
  makeStars();
}
window.addEventListener("resize", resize);

/* Background gradients are built on resize, never per frame. */
let bgGrad = null;
let nebulaA = null;
let nebulaB = null;

function makeBackground() {
  bgGrad = ctx.createLinearGradient(0, 0, W, H);
  bgGrad.addColorStop(0, "#0c0b09");
  bgGrad.addColorStop(0.55, "#0a0907");
  bgGrad.addColorStop(1, "#080706");

  nebulaA = ctx.createRadialGradient(W * 0.22, H * 0.2, 0, W * 0.22, H * 0.2, Math.max(W, H) * 0.5);
  nebulaA.addColorStop(0, "rgba(120, 88, 40, 0.14)");
  nebulaA.addColorStop(0.5, "rgba(80, 60, 30, 0.05)");
  nebulaA.addColorStop(1, "rgba(0, 0, 0, 0)");

  nebulaB = ctx.createRadialGradient(W * 0.82, H * 0.75, 0, W * 0.82, H * 0.75, Math.max(W, H) * 0.42);
  nebulaB.addColorStop(0, "rgba(110, 52, 30, 0.1)");
  nebulaB.addColorStop(1, "rgba(0, 0, 0, 0)");
}

/* One noise tile for the whole session, blitted each frame at low opacity. */
const noiseTile = document.createElement("canvas");
noiseTile.width = 256;
noiseTile.height = 256;
{
  const nctx = noiseTile.getContext("2d");
  const image = nctx.createImageData(256, 256);
  const data = image.data;
  for (let i = 0; i < data.length; i += 4) {
    const v = 160 + ((Math.random() * 96) | 0);
    data[i] = v;
    data[i + 1] = v;
    data[i + 2] = v;
    data[i + 3] = (Math.random() * 255) | 0;
  }

}
const noisePattern = ctx.createPattern(noiseTile, "repeat");

const motionPref = window.matchMedia("(prefers-reduced-motion: reduce)");
let reduceMotion = motionPref.matches;
motionPref.addEventListener("change", (event) => {
  reduceMotion = event.matches;
});

/* ------------------------------------------------------------------ */
/* Visual constants                                                    */
/* ------------------------------------------------------------------ */

const STYLES = {
  researcher: { color: "#43c6ff", size: 15, ring: false, moon: true,  texture: "plate" },
  writer:     { color: "#ff9f43", size: 14, ring: true,  moon: false, texture: "bands" },
  // Teal-green so a working checker never shares the success green.
  checker:    { color: "#2dd4bf", size: 10, ring: false, moon: true,  texture: "spots" },
  logger:     { color: "#a78bfa", size: 10, ring: false, moon: false, texture: "strata" },
  notifier:   { color: "#f472b6", size: 10, ring: true,  moon: false, texture: "cap" },
};
const FALLBACK = ["#60a5fa", "#818cf8", "#34d399", "#f87171", "#c084fc", "#22d3ee", "#fb7185"];

function styleFor(agent) {
  if (STYLES[agent]) return STYLES[agent];
  let hash = 0;
  for (let i = 0; i < agent.length; i += 1) hash = (hash * 31 + agent.charCodeAt(i)) % 1000003;
  return {
    color: FALLBACK[hash % FALLBACK.length],
    size: 10 + (hash % 5),
    ring: hash % 3 === 0,
    moon: hash % 4 === 0,
    texture: motifNames[hash % motifNames.length],
    seed: hash,
  };
}

/* ------------------------------------------------------------------ */
/* Planet surface textures                                             */
/* ------------------------------------------------------------------ */

// One low-frequency motif per style, drawn monochrome so the disc colour
// underneath decides hue. Generated once per style and kept for the page.
const TEXTURE_TILE = 128;
const TEXTURE_STAMP = 2.2; // tile width as a multiple of the disc diameter
const MOTIFS = {
  // researcher: one large dark plate
  plate(g, R) {
    g.fillStyle = "rgba(0, 0, 0, 0.62)";
    g.beginPath();
    g.ellipse(R * 0.1, R * 0.08, R * 0.74, R * 0.6, 0.5, 0, TAU);
    g.fill();
  },
  // writer: two broad bands
  bands(g, R) {
    g.fillStyle = "rgba(0, 0, 0, 0.56)";
    g.fillRect(-R * 1.4, -R * 0.62, R * 2.8, R * 0.42);
    g.fillRect(-R * 1.4, R * 0.2, R * 2.8, R * 0.42);
  },
  // checker: a few scattered coarse spots
  spots(g, R, rand) {
    g.fillStyle = "rgba(0, 0, 0, 0.62)";
    for (let i = 0; i < 4; i += 1) {
      const angle = rand() * TAU;
      const dist = R * (0.18 + rand() * 0.5);
      g.beginPath();
      g.arc(Math.cos(angle) * dist, Math.sin(angle) * dist, R * (0.22 + rand() * 0.1), 0, TAU);
      g.fill();
    }
  },
  // logger: thin horizontal strata
  strata(g, R) {
    g.fillStyle = "rgba(0, 0, 0, 0.52)";
    for (let i = -2; i <= 2; i += 1) {
      g.fillRect(-R * 1.4, i * R * 0.44 - R * 0.1, R * 2.8, R * 0.2);
    }
  },
  // notifier: a bright polar cap
  cap(g, R) {
    g.fillStyle = "rgba(255, 255, 255, 0.82)";
    g.beginPath();
    g.ellipse(0, -R * 0.92, R * 1.3, R * 0.56, 0, 0, TAU);
    g.fill();
  },
};

// Stable order: an unknown name's hash picks from the same list every reload.
const motifNames = Object.keys(MOTIFS);
const tileCache = new Map();

// One canvas per key: build it the first time it is asked for, then reuse it.
function cachedTile(key, build) {
  let tile = tileCache.get(key);
  if (tile) return tile;
  tile = document.createElement("canvas");
  tile.width = tile.height = TEXTURE_TILE;
  build(tile.getContext("2d"));
  tileCache.set(key, tile);
  return tile;
}

// Deterministic generator so a role's texture is identical across reloads.
function textureRandom(seed) {
  let value = (seed % 2147483647) + 11;
  return () => {
    value = (value * 48271) % 2147483647;
    return value / 2147483647;
  };
}

function textureTile(style) {
  const key = `${style.texture}:${style.seed || 0}`;
  return cachedTile(key, (g) => {
    const centre = TEXTURE_TILE / 2;
    // Rotated once by the style seed; the disc radius in tile space is what
    // survives the 2.2x stamp, so every motif is drawn within it.
    g.translate(centre, centre);
    g.rotate((style.seed || 0) * 0.011);
    MOTIFS[style.texture](g, centre / TEXTURE_STAMP, textureRandom(style.seed || 0));
  });
}

/* ------------------------------------------------------------------ */
/* State                                                               */
/* ------------------------------------------------------------------ */

const state = {

  runId: null,
  sun: "idle",
  detail: "",
  plans: [],             // [{step, agent}]

  ordered: [],           // planets sorted back-to-front, rebuilt once per frame
  alignPhase: null,      // in | hold | out
  alignStart: 0,
  alignAmount: 0,
  pulseAt: 0,            // Sun's alignment pulse ring, 0 = none
  slowUntil: 0,
  pending: null,
  extraPlanets: 0,
  log: [],
  records: [],           // every event applied for the current run (roster source)
  hover: null,
  outputs: null,
  outputsRun: null,
  detailData: null,
  detailRun: null,
  lastSeconds: null,
  lastStopReason: "",
  lastFailure: null,
  lastResultStatus: null,
  lastRunStatus: null,
};

let stars = [];
let lastNow = performance.now();
let camX = 0;
let camY = 0;
const CAM_LIMIT = 10;

function makeStars() {
  const count = 150 + Math.floor(Math.random() * 100);
  stars = [];
  for (let i = 0; i < count; i += 1) {
    const depth = Math.random();

  }
}

/* ------------------------------------------------------------------ */
/* DOM references                                                      */
/* ------------------------------------------------------------------ */

const taskInput = document.getElementById("task");
const cmdbar = document.getElementById("cmdbar");

const approveBtn = document.getElementById("approve");
const rejectBtn = document.getElementById("reject");
