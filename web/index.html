<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sol-O · Solar Orchestrator</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0c0b09;
    --surface: #13110e;
    --fg: #ece7dc;
    --muted: #a39a89;
    /* One line colour for every structural divider. */
    --line: #2b2720;
    --accent: #e9b45c;
    --success: #8cc79d;
    --warning: #e0a35c;
    --error: #e28372;
    --info: #8fb3d9;
    --radius: 2px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --dur-fast: 120ms;
    --header-h: 56px;
    /* Measured height of the command dock the sheet and drawer stack above. */
    --dock-h: 76px;
    --font-ui: "Space Grotesk", "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: var(--font-ui); font-size: 14px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  body { overflow: hidden; }
  a:link, a:visited { color: inherit; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  canvas#sky { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; z-index: 0; }

  /* One full-viewport console: header, feed rail, stage, run plan, dock. */
  #app {
    position: relative; z-index: 1;
    height: 100vh; display: grid;
    grid-template-columns: clamp(320px, 28vw, 400px) minmax(0, 1fr) 300px;
    grid-template-rows: auto minmax(0, 1fr) auto auto;
    grid-template-areas:
      "bar bar bar"
      "feed stage roster"
      "out stage roster"
      "dock dock dock";
    /* The empty stage is the canvas's mouse target; only the chrome takes clicks. */
    pointer-events: none;
  }
  #bar, #log, #roster, #output, #cmdbar, #sheet, #panel, #approval { pointer-events: auto; }
  #stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; }

  /* Header: wordmark, quiet run state, replay controls. */
  #bar {
    grid-area: bar; min-width: 0; min-height: 56px;
    display: flex; align-items: center; gap: 16px;
    padding: 0 16px;
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  #bar .wordmark {
    flex: none; font-weight: 600; font-size: 15px; line-height: 1.2;
    letter-spacing: 0; color: var(--fg); white-space: nowrap;
  }
  /* A semantic dot plus a sentence-case label, not a bordered pill. */
  #pill {
    flex: none; display: inline-flex; align-items: center; gap: 8px;
    height: 32px; padding: 0 4px; border: 0; background: none;
    color: var(--muted); font-size: 13px; font-weight: 500; line-height: 1.4;
    cursor: pointer; transition: color var(--dur-fast) var(--ease);
  }
  #pill:hover { color: var(--fg); background: none; }
  #pill .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted); flex: none;
  }
  #pill.planning { color: var(--info); }
  #pill.planning .dot { background: var(--info); }
  #pill.working { color: var(--accent); }
  #pill.working .dot { background: var(--accent); }
  #pill.complete { color: var(--success); }
  #pill.complete .dot { background: var(--success); }
  #pill.failed { color: var(--error); }
  #pill.failed .dot { background: var(--error); }
  #pill.awaiting, #pill.warn { color: var(--warning); }
  #pill.awaiting .dot, #pill.warn .dot { background: var(--warning); }

  #bar .replay-bar { margin-left: auto; display: flex; align-items: center; gap: 12px; min-width: 0; }
  #replay-controls { display: flex; align-items: center; gap: 4px; }
  #replay-controls button {
    height: 32px; padding: 0 8px; border: 0; background: none;
    color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums;
  }
  #replay-controls button:hover { color: var(--fg); background: none; }
  #replay-controls button[aria-pressed="true"] { color: var(--accent); }
  select#replay {
    height: 32px; max-width: 280px; min-width: 0; border-radius: var(--radius);
    border: 1px solid transparent; background: transparent; color: var(--muted);
    font-size: 12px; padding: 0 4px;
  }
  select#replay:hover { color: var(--fg); }

  /* Bottom command dock: examples, task, one primary Run. */
  #cmdbar {
    grid-area: dock;
    display: grid; grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "presets presets" "task run";
    align-items: center; gap: 8px 12px; padding: 12px 16px;
    background: var(--surface); border-top: 1px solid var(--line);
  }
  #presets { grid-area: presets; display: flex; flex-wrap: wrap; gap: 0 16px; align-items: center; }
  /* Example tasks are quiet text buttons; only Run is a fill. */
  #presets .chip {
    flex: none; height: auto; padding: 2px 0; border: 0; border-radius: 0;
    background: none; color: var(--muted); font-size: 12px; font-weight: 400;
    line-height: 1.5; white-space: nowrap;
  }
  #presets .chip:hover { color: var(--fg); background: none; }
  #task {
    grid-area: task; width: 100%; height: 38px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--bg);
    color: var(--fg); padding: 0 12px; font-size: 14px;
  }
  #task:focus { border-color: rgba(233, 180, 92, 0.55); outline: none; }
  #task::placeholder { color: var(--muted); }
  button {
    height: 32px; border-radius: var(--radius); border: 1px solid var(--line);
    background: transparent; color: var(--fg); font-size: 13px;
    font-weight: 500; letter-spacing: 0; padding: 0 12px; cursor: pointer;
    transition: border-color var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  }
  button:hover { border-color: #3a352b; background: rgba(236, 231, 220, 0.04); }
  /* Run is the only solid accent surface on the page. */
  #run {
    grid-area: run; height: 38px; padding: 0 22px; font-size: 13px;
    background: var(--accent); border-color: var(--accent); color: #17130c;
    font-weight: 600; letter-spacing: 0;
  }
  #run:hover { background: #f0c271; border-color: #f0c271; }

  /* Activity feed: left rail, quiet lines, newest at the bottom. */
  #log {
    grid-area: feed; display: flex; flex-direction: column; min-height: 0;
    background: var(--surface);
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    font-size: 12px; line-height: 1.55;
  }
  #log .head {
    flex: none; display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    font-size: 12px; font-weight: 600; color: var(--fg);
  }
  #log .head button {
    height: 28px; padding: 0 6px; border: 0; background: none;
    color: var(--muted); font-size: 12px; font-weight: 400;
  }
  #log .head button:hover { color: var(--fg); background: none; }
  #log-lines {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    scrollbar-width: thin; padding: 4px 0;
  }
  #log .line {
    display: grid; grid-template-columns: auto 6px minmax(0, 1fr);
    align-items: baseline; gap: 8px; padding: 5px 16px;
    color: var(--muted);
  }
  #log .line time {
    font-family: var(--font-mono); font-size: 11px;
    font-variant-numeric: tabular-nums; color: var(--muted);
  }
  #log .line .dot {
    align-self: center; width: 6px; height: 6px; border-radius: 50%;
    background: var(--dot);
  }
  /* Summaries wrap: a failure or tool detail is never silently clipped. */
  #log .line .what { min-width: 0; overflow-wrap: anywhere; }
  #log .line.failed .dot { background: var(--error); }
  #log .line.failed .what { color: var(--error); }
  #log .line.done .dot { background: var(--success); }
  #log .line.done .what { color: var(--success); }
  /* Idle copy: a pseudo-element, so the append-only child counter stays exact. */
  #log-lines:empty::before {
    content: "Activity appears when a run starts.";
    display: block; padding: 8px 16px; color: var(--muted);
  }

  /* Blocking gate: centred scrim above every panel and sheet. */
  #approval {
    position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
    padding: 16px; background: rgba(8, 7, 6, 0.72);
  }
  #approval .card {
    width: min(520px, 92vw); background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius); padding: 24px;
  }
  #approval h2 {
    margin: 0 0 8px; font-size: 20px; font-weight: 500; line-height: 1.3; color: var(--fg);
  }
  #approval .explain { margin: 0 0 16px; font-size: 13px; line-height: 1.55; color: var(--muted); }
  #approval-preview {
    font-size: 13px; line-height: 1.55; color: var(--fg);
    white-space: pre-wrap; overflow-wrap: anywhere;
    max-height: 200px; overflow: auto;
    border-left: 1px solid var(--line); padding-left: 12px;
  }
  #approval-label { margin: 12px 0 0; font-size: 12px; color: var(--muted); }
  #approval-label:empty { display: none; }
  #approval .row { display: flex; gap: 8px; margin-top: 24px; justify-content: flex-end; flex-wrap: wrap; }
  /* Approve and send is the only other solid fill after Run. */
  #approve { background: var(--accent); border-color: var(--accent); color: #17130c; font-weight: 600; }
  #approve:hover { background: #f0c271; border-color: #f0c271; }
  #reject { background: transparent; border-color: var(--line); color: var(--fg); }
  /* Replayed gate is a read-only notice: no scrim, no modal, no decisions. */
  #approval.replay {
    inset: calc(var(--header-h) + 12px) 0 auto 0; padding: 0 16px;
    align-items: flex-start; background: none; pointer-events: none;
  }
  #approval.replay .card { pointer-events: auto; margin: 0 auto; }
  #approval.replay .row { display: none; }

  #tooltip {
    position: fixed; z-index: 35; pointer-events: none; max-width: 320px;
    padding: 8px 10px; border-radius: var(--radius); font-size: 12px; line-height: 1.45;
    color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  }
  #tooltip .tip-head { display: flex; align-items: baseline; gap: 8px; }
  #tooltip .tip-name { font-size: 13px; font-weight: 600; }
  #tooltip .tip-status { font-size: 12px; color: var(--tone, var(--muted)); }
  #tooltip .tip-summary {
    display: block; margin-top: 4px; max-width: 280px;
    font-size: 12px; color: var(--muted); overflow-wrap: anywhere;
  }

  #panel {
    /* Drawer: a fixed overlay on the run-plan rail; the result stays left. */
    position: fixed; top: var(--header-h); right: 0; bottom: var(--dock-h);
    z-index: 30; width: 300px;
    display: flex; flex-direction: column;
    background: var(--surface); border-left: 1px solid var(--line);
  }
  #panel header {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    font-size: 12px; font-weight: 600; color: var(--fg);
  }
  #panel-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #panel header button { height: 28px; width: 28px; padding: 0; font-size: 16px; line-height: 1; border: 0; background: none; color: var(--muted); }
  #panel header button:hover { color: var(--fg); background: none; }
  #panel-status { font-size: 12px; font-weight: 400; color: var(--muted); white-space: nowrap; }
  #panel-status.called { color: var(--info); }
  #panel-status.working { color: var(--accent); }
  #panel-status.done { color: var(--success); }
  #panel-status.failed { color: var(--error); }
  #panel-body { flex: 1; min-height: 0; padding: 16px; overflow: auto; font-size: 13px; line-height: 1.6; color: var(--fg); }
  #panel .fields { margin: 0; display: grid; gap: 12px; }
  #panel .fields div { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; }
  #panel dt { font-size: 12px; font-weight: 400; color: var(--muted); padding-top: 1px; }
  #panel dd { margin: 0; color: var(--fg); white-space: pre-wrap; overflow-wrap: anywhere; }
  #panel .out-label {
    display: block; margin: 20px 0 8px; font-size: 12px; color: var(--muted);
  }
  #panel pre {
    margin: 0; font-family: var(--font-mono); font-size: 12px; line-height: 1.55;
    color: var(--fg); white-space: pre-wrap; overflow-wrap: anywhere;
  }

  /* Run plan: one flat list of steps in the right rail. */
  #roster {
    grid-area: roster; display: flex; flex-direction: column; min-height: 0;
    width: 300px; justify-self: end;
    background: var(--surface); border-left: 1px solid var(--line);
  }
  #roster .rh {
    flex: none; display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    font-size: 12px; font-weight: 600; color: var(--fg);
  }
  #roster .rh .count {
    font-family: var(--font-mono); font-size: 11px; font-weight: 400;
    font-variant-numeric: tabular-nums; color: var(--muted);
  }
  #roster-rows { overflow: auto; flex: 1; min-height: 0; }
  #roster .empty { margin: 0; padding: 12px 16px; font-size: 12px; line-height: 1.55; color: var(--muted); }
  #roster .row {
    display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; padding: 12px 16px;
    border-top: 1px solid var(--line); cursor: pointer;
  }
  #roster .row:first-child { border-top: 0; }
  #roster .row:hover { background: rgba(236, 231, 220, 0.04); }
  #roster .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  #roster .step {
    font-family: var(--font-mono); font-size: 11px; font-weight: 400; line-height: 1.5;
    font-variant-numeric: tabular-nums; color: var(--muted);
  }
  #roster .nm { display: flex; align-items: center; gap: 8px; min-width: 0; }
  #roster .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--row-accent); }
  #roster .agent {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 13px; font-weight: 600;
  }
  #roster .status { margin-left: auto; flex: none; font-size: 12px; color: var(--muted); }
  #roster .status.called { color: var(--info); }
  #roster .status.working { color: var(--accent); }
  #roster .status.done { color: var(--success); }
  #roster .status.failed { color: var(--error); }
  #roster .role {
    margin-top: 2px; font-size: 12px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  #output {
    /* Result: the left rail's lower row, so the stage is never covered. */
    grid-area: out; display: flex; flex-direction: column; min-height: 0;
    max-height: min(46vh, 520px);
    background: var(--surface);
    border-right: 1px solid var(--line); border-top: 1px solid var(--line);
  }
  #output header {
    flex: none; display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    font-size: 12px; font-weight: 600; color: var(--muted);
  }
  #output header button { height: 28px; width: 28px; padding: 0; font-size: 16px; line-height: 1; border: 0; background: none; color: var(--muted); }
  #output header button:hover { color: var(--fg); background: none; }
  #output-meta {
    flex: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px 16px; margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  #output-meta div { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  #output-meta dt { font-size: 11px; color: var(--muted); }
  #output-meta dd {
    margin: 0; font-family: var(--font-mono); font-size: 11px; line-height: 1.45;
    font-variant-numeric: tabular-nums; color: var(--fg); overflow-wrap: anywhere;
  }
  #output-body {
    flex: 1 1 auto; padding: 16px; overflow: auto; min-height: 0;
    overscroll-behavior: contain;
    white-space: pre-wrap; overflow-wrap: anywhere;
    max-width: 68ch;
    font-size: 14px; line-height: 1.6; color: var(--fg);
  }
  #output-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The panel takes focus on open; an outline here reads as a selection. */
  #output:focus-visible { outline: none; }
  #output .actions { flex: none; display: flex; justify-content: flex-end; padding: 0 16px 16px; }
  #output .actions button { height: 32px; padding: 0 4px; border: 0; background: none; color: var(--accent); }
  #output .actions button:hover { background: none; color: #f0c271; }

  /* The run plan and activity feed share one bottom sheet below 1180px;
     wider, the wrapper is transparent to the grid and they dock in their rails. */
  #sheet, #sheet-body { display: contents; }
  #sheet .sheet-head { display: none; }

  @media (max-width: 1179.98px) {
    /* The header wraps to two rows here; --header-h is measured from it. */
    #app {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas: "bar" "stage" "dock";
    }

    #bar {
      flex-wrap: wrap; gap: 8px 12px;
      padding: 8px max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));
    }
    #bar .replay-bar { flex: 1 1 100%; margin-left: 0; justify-content: space-between; }
    select#replay { flex: 1 1 auto; max-width: none; min-width: 0; }

    #cmdbar { padding: 10px max(16px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }

    #sheet {
      position: fixed; z-index: 28;
      left: max(16px, env(safe-area-inset-left));
      right: max(16px, env(safe-area-inset-right));
      bottom: calc(16px + var(--dock-h));
      display: flex; flex-direction: column; max-height: 50vh;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    #sheet .sheet-head { display: flex; align-items: center; gap: 8px; padding: 4px 8px; }
    #sheet.open .sheet-head { border-bottom: 1px solid var(--line); }
    #sheet-toggle { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 0 4px; color: var(--fg); }
    #sheet-toggle:hover { background: none; }
    #sheet .sheet-tabs { display: none; }
    #sheet.open .sheet-tabs { display: flex; gap: 4px; }
    #sheet .sheet-tabs button { height: 32px; padding: 0 10px; border: 0; background: none; color: var(--muted); }
    #sheet .sheet-tabs button[aria-pressed="true"] { color: var(--accent); }
    #sheet:not(.open) #sheet-body { display: none; }
    #sheet-body { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    #sheet[data-tab="roster"] #log,
    #sheet[data-tab="feed"] #roster { display: none; }

    /* Dock the rails into the sheet instead of the viewport. */
    #roster, #log {
      grid-area: auto; position: static; width: auto; max-height: none; min-height: 0; flex: 1;
      border: 0; background: transparent;
    }
    #log .head { display: none; }

    /* Result and drawer become full-screen sheets; the chrome steps aside. */
    #panel, #output {
      position: fixed; inset: 0; width: auto; max-width: none; max-height: none;
      border: 0;
    }
    #panel {
      z-index: 32; overflow-x: hidden;
      padding-top: env(safe-area-inset-top, 0);
      padding-right: env(safe-area-inset-right, 0);
      padding-bottom: env(safe-area-inset-bottom, 0);
      padding-left: env(safe-area-inset-left, 0);
    }
    #output {
      z-index: 34;
      padding-top: env(safe-area-inset-top, 0);
      padding-right: env(safe-area-inset-right, 0);
      padding-left: env(safe-area-inset-left, 0);
    }
    #output header, #output-meta, #output-body, #output .actions { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
    #output-body, #panel-body { padding-bottom: 24px; }
    body.modal-open #bar, body.modal-open #cmdbar, body.modal-open #sheet { display: none; }

    #approval { padding: 16px max(16px, env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left)); }
    #approval .card { width: 100%; }
  }

  @media (max-width: 600px) {
    /* Phone: 44px touch targets, wrapping controls, no sideways scroll. */
    #bar { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
    #pill { min-height: 44px; padding: 0 2px; }
    #bar .replay-bar { gap: 8px; }
    #replay-controls button, select#replay { min-height: 44px; }
    button { min-height: 44px; }
    #presets .chip { min-height: 44px; padding: 0 2px; }
    /* 16px keeps a focused field from triggering iOS focus zoom. */
    #task, select#replay { font-size: 16px; }
    #run { height: 44px; }
    #task { height: 44px; }
    #sheet .sheet-head { padding: 2px 8px; }
    #sheet-toggle { min-height: 44px; }
    #sheet .sheet-tabs button { min-height: 44px; }
    #log .head button, #output header button, #panel header button { min-height: 44px; width: 44px; }
    #approval .row button { min-height: 44px; }
    #roster .row { min-height: 48px; }
  }

  @media (prefers-reduced-motion: reduce) {
    /* Every state change snaps; nothing waits on an animation. */
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true" tabindex="-1"></canvas>

<div id="app">
  <header id="bar">
    <span class="wordmark">Sol-O</span>
    <button type="button" id="pill"><i class="dot" aria-hidden="true"></i><span id="pill-text" role="status">Idle</span></button>
    <div class="replay-bar">
      <div id="replay-controls" class="hidden" role="group" aria-label="Replay controls">
        <button id="replay-pause" type="button" aria-pressed="false">Pause</button>
        <button id="replay-speed" type="button" aria-pressed="false" aria-label="Replay speed">1x</button>
      </div>
      <select id="replay" aria-label="Replay a stored run"><option value="">Replay a run…</option></select>
    </div>
  </header>

  <div id="stage" aria-hidden="true"></div>

  <div id="cmdbar" role="search" aria-label="Start a run">
    <div id="presets" role="group" aria-label="Example tasks">
      <button type="button" class="chip" data-task="Plan a three-day trip to Lisbon and write the itinerary.">Plan a trip</button>
      <button type="button" class="chip" data-task="Review this function for bugs and summarise the issues.">Review code</button>
      <button type="button" class="chip" data-task="Write a short report on what the team shipped this week.">Write a report</button>
    </div>
    <input id="task" autocomplete="off" spellcheck="false" aria-label="Task"
           placeholder="Give the Sun a task…">
    <button id="run">Run</button>
  </div>

<div id="approval" class="hidden" role="dialog" aria-modal="true" aria-labelledby="approval-heading">
  <div class="card">
    <h2 id="approval-heading">Approval required</h2>
    <p class="explain" id="approval-explain">Nothing has been sent. Approving sends the stored message once. Rejecting ends this action.</p>
    <div id="approval-preview"></div>
    <p id="approval-label" role="status"></p>
    <div class="row">
      <button id="reject">Reject</button>
      <button id="approve">Approve and send</button>
    </div>
  </div>
</div>

<div id="tooltip" class="hidden"></div>

<div id="panel" class="hidden" role="dialog" aria-labelledby="panel-title">
  <header>
    <span id="panel-title">planet</span>
    <span id="panel-status" class="status"></span>
    <button id="panel-close" aria-label="Close agent drawer">×</button>
  </header>
  <div id="panel-body">
    <dl class="fields">
      <div><dt>Role</dt><dd id="panel-role"></dd></div>
      <div><dt>Task</dt><dd id="panel-task"></dd></div>
      <div><dt>Duration</dt><dd id="panel-duration"></dd></div>
    </dl>
    <span class="out-label">Raw output</span>
    <pre id="panel-output">loading…</pre>
  </div>
</div>

<div id="sheet" data-tab="roster">
  <div class="sheet-head">
    <button id="sheet-toggle" type="button" aria-expanded="false" aria-controls="sheet-body">Run plan and activity</button>
    <div class="sheet-tabs" role="group" aria-label="Run plan and activity">
      <button id="tab-roster" type="button" aria-pressed="true" aria-controls="roster">Run plan</button>
      <button id="tab-feed" type="button" aria-pressed="false" aria-controls="log">Activity</button>
    </div>
  </div>
  <div id="sheet-body">
    <aside id="roster" aria-label="Run plan">
      <div class="rh"><span>Run plan</span><span id="roster-count" class="count"></span></div>
      <div id="roster-rows">
        <p class="empty">Start a run to see its plan.</p>
      </div>
    </aside>

    <div id="log">
      <div class="head">
        <span id="log-title">Activity</span>
        <button id="log-toggle" aria-controls="log-lines" aria-expanded="true">Hide</button>
      </div>
      <div id="log-lines" role="log" aria-live="polite" aria-relevant="additions" aria-labelledby="log-title"></div>
    </div>
  </div>
</div>

<div id="output" class="hidden" role="dialog" aria-labelledby="output-title" tabindex="-1">
  <header><span id="output-title">Result</span><button id="output-close" aria-label="Close result">×</button></header>
  <dl id="output-meta">
    <div><dt>State</dt><dd id="meta-state"></dd></div>
    <div><dt>Duration</dt><dd id="meta-duration"></dd></div>
    <div><dt>Verdict</dt><dd id="meta-verdict"></dd></div>
    <div><dt>Run</dt><dd id="meta-run"></dd></div>
  </dl>
  <div id="output-body"></div>
  <div class="actions"><button id="output-replay">Replay</button></div>
</div>
</div>

<script>
"use strict";

/* ------------------------------------------------------------------ */
/* Canvas setup                                                        */
/* ------------------------------------------------------------------ */

const canvas = document.getElementById("sky");
const ctx = canvas.getContext("2d");
const TAU = Math.PI * 2;
let W = window.innerWidth;
let H = window.innerHeight;
let stageRect = { left: 0, top: 0, width: W, height: H };
let CX = W / 2;
let CY = H / 2;

/* The Sun centres in the stage box between the rails, not in the viewport. */
function syncStage() {
  const box = document.getElementById("stage").getBoundingClientRect();
  stageRect = { left: box.left, top: box.top, width: box.width, height: box.height };
  CX = box.left + box.width / 2;
  CY = box.top + box.height / 2;
}

function syncHeaderHeight() {
  // The header wraps below 1180px; surfaces offset from its measured height.
  // A full-screen result or drawer hides the header, so keep the last value.
  const height = bar.offsetHeight;
  if (height) document.documentElement.style.setProperty("--header-h", `${height}px`);
  syncStage();
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  syncHeaderHeight();
  requestFrame();
}
window.addEventListener("resize", resize);

const motionPref = window.matchMedia("(prefers-reduced-motion: reduce)");
let reduceMotion = motionPref.matches;
motionPref.addEventListener("change", (event) => {
  reduceMotion = event.matches;
});

/* ------------------------------------------------------------------ */
/* Visual constants                                                    */
/* ------------------------------------------------------------------ */

const P = {
  bg: "#0c0b09", line: "#2b2720", fg: "#ece7dc", muted: "#a39a89",
  accent: "#e9b45c", success: "#8cc79d", error: "#e28372",
};

const STYLES = {
  researcher: { color: "#43c6ff", size: 13 },
  writer:     { color: "#ff9f43", size: 12 },
  // Teal-green so a working checker never shares the success green.
  checker:    { color: "#2dd4bf", size: 10 },
  logger:     { color: "#a78bfa", size: 10 },
  notifier:   { color: "#f472b6", size: 10 },
};
const FALLBACK = ["#60a5fa", "#818cf8", "#34d399", "#f87171", "#c084fc", "#22d3ee", "#fb7185"];

function styleFor(agent) {
  if (STYLES[agent]) return STYLES[agent];
  let hash = 0;
  for (let i = 0; i < agent.length; i += 1) hash = (hash * 31 + agent.charCodeAt(i)) % 1000003;
  return { color: FALLBACK[hash % FALLBACK.length], size: 11 };
}

/* ------------------------------------------------------------------ */
/* State                                                               */
/* ------------------------------------------------------------------ */

const state = {
  mode: "live",          // live | replay
  follow: null,          // run id being visualised
  runId: null,
  sun: "idle",
  detail: "",
  plans: [],             // [{step, agent}]
  planets: new Map(),    // "step:agent" -> planet
  ordered: [],           // planets sorted back-to-front, rebuilt once per frame
  alignPhase: null,      // in | hold | out
  alignStart: 0,
  alignAmount: 0,
  pending: null,
  extraPlanets: 0,
  log: [],
  records: [],           // every event applied for the current run (roster source)
  hover: null,
  outputs: null,
  outputsRun: null,
  detailData: null,
  detailRun: null,
  lastSeconds: null,
  lastStopReason: "",
  lastFailure: null,
  lastResultStatus: null,
};

/* ------------------------------------------------------------------ */
/* DOM references                                                      */
/* ------------------------------------------------------------------ */

const bar = document.getElementById("bar");
const taskInput = document.getElementById("task");
const cmdbar = document.getElementById("cmdbar");
const runButton = document.getElementById("run");
const presets = document.getElementById("presets");
const pill = document.getElementById("pill");
const pillText = document.getElementById("pill-text");
const replaySelect = document.getElementById("replay");
const replayControls = document.getElementById("replay-controls");
const replayPause = document.getElementById("replay-pause");
const replaySpeed = document.getElementById("replay-speed");
const logLines = document.getElementById("log-lines");
const logToggle = document.getElementById("log-toggle");
const approvalBox = document.getElementById("approval");
const approvalHeading = document.getElementById("approval-heading");
const approvalExplain = document.getElementById("approval-explain");
const approvalLabel = document.getElementById("approval-label");
const approvalPreview = document.getElementById("approval-preview");
const approveBtn = document.getElementById("approve");
const rejectBtn = document.getElementById("reject");
const tooltip = document.getElementById("tooltip");
const panel = document.getElementById("panel");
const panelTitle = document.getElementById("panel-title");
const panelStatus = document.getElementById("panel-status");
const panelRole = document.getElementById("panel-role");
const panelTask = document.getElementById("panel-task");
const panelDuration = document.getElementById("panel-duration");
const panelOutput = document.getElementById("panel-output");
const panelClose = document.getElementById("panel-close");
const outputBox = document.getElementById("output");
const outputTitle = document.getElementById("output-title");
const metaState = document.getElementById("meta-state");
const metaDuration = document.getElementById("meta-duration");
const metaVerdict = document.getElementById("meta-verdict");
const metaRun = document.getElementById("meta-run");
const outputBody = document.getElementById("output-body");
const outputClose = document.getElementById("output-close");
const outputReplay = document.getElementById("output-replay");
const rosterRows = document.getElementById("roster-rows");
const rosterCount = document.getElementById("roster-count");
const sheet = document.getElementById("sheet");
const sheetToggle = document.getElementById("sheet-toggle");
const tabRoster = document.getElementById("tab-roster");
const tabFeed = document.getElementById("tab-feed");

/* ------------------------------------------------------------------ */
/* Small helpers                                                       */
/* ------------------------------------------------------------------ */

const clamp = (value, lo, hi) => Math.min(hi, Math.max(lo, value));
const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[ch]));
}

/* One run-state vocabulary for the pill, the Sun and the result meta. */
const RUN_STATE_LABEL = {
  orchestrating: "running",
  working: "running",
  awaiting: "waiting for approval",
  awaiting_approval: "waiting for approval",
};
const RUN_STATE_TONE = {
  planning: "planning",
  running: "working",
  "waiting for approval": "awaiting",
  complete: "complete",
  partial: "warn",
  "needs clarification": "warn",
  rejected: "failed",
  failed: "failed",
};

function runStateLabel(status) {
  const key = String(status == null ? "" : status).trim().toLowerCase()
    .replace(/[\s_-]+/g, "_").replace(/^_+|_+$/g, "");
  return RUN_STATE_LABEL[key] || key.replace(/_/g, " ") || "idle";
}

/* Sentence case: the vocabulary is lowercase, the surface capitals the first word. */
function sentenceCase(text) {
  const value = String(text == null ? "" : text);
  return value ? value.charAt(0).toUpperCase() + value.slice(1) : value;
}

/* A detail that repeats the state would read as a second state. */
function runDetailText(label, detail) {
  const text = String(detail || "").trim();
  return runStateLabel(text) === label ? "" : text;
}

function setSun(status, detail) {
  // While an approval is pending, worker/tool events must not hide the gate.
  if (state.pending && (status === "orchestrating" || status === "planning")) status = "awaiting";
  state.sun = status;
  state.detail = detail || "";
  const label = runStateLabel(status);
  const shown = sentenceCase(label);
  pillText.textContent = state.mode === "replay" ? `Replay — ${shown}` : shown;
  pill.className = RUN_STATE_TONE[label] || "";
  requestFrame();
}

function feedLine(name, data, time) {
  const ok = data && data.ok;
  return {
    time: time != null ? time : new Date().toLocaleTimeString([], { hour12: false }),
    name,
    text: summariseEvent(name, data),
    agent: (data && data.agent) || "",
    accent: data && data.agent ? styleFor(data.agent).color : null,
    failed: /fail|error/i.test(name) || (name === "tool_done" && ok === false),
  };
}

function pushLog(name, data, time) {
  state.log.push(feedLine(name, data, time));
  if (state.log.length > 40) {
    state.log.shift();
    // Mirror the trim in the DOM so renderLog only appends what is new.
    if (logLines.firstElementChild) logLines.firstElementChild.remove();
  }
  renderLog();
}

function logLineHtml(item) {
  // Only genuine completion is a done line: partial/clarification all_done is neutral.
  const done = !item.failed && (item.name === "agent_done" ||
    (item.name === "all_done" && /^complete\b/i.test(item.text)));
  const text = item.text;
  return `<div class="line${item.failed ? " failed" : done ? " done" : ""}"` +
    ` style="--dot:${item.accent || "#a39a89"}">` +
    `<time>${escapeHtml(item.time)}</time><i class="dot"></i>` +
    `<span class="what">${escapeHtml(text)}</span></div>`;
}

function renderLog() {
  // Append-only: rebuilding innerHTML would re-announce the whole feed.
  while (logLines.childElementCount > state.log.length) logLines.firstElementChild.remove();
  state.log.slice(logLines.childElementCount).forEach((item) =>
    logLines.insertAdjacentHTML("beforeend", logLineHtml(item)));
  // Newest line at the bottom; assigning scrollTop moves nothing else.
  logLines.scrollTop = logLines.scrollHeight;
}

function summariseEvent(name, data) {
  if (!data) return name;
  const step = data.step != null && data.step > 0 ? `step ${data.step}` : "";
  const agent = data.agent || "";
  const join = (...parts) => parts.filter(Boolean).join(" ");
  switch (name) {
    case "run_started":
      return `Run started: ${data.task || ""}`.trim();
    case "plan_ready": {
      const agents = data.agents || (data.steps || []).map((item) => item.agent);
      return `Plan ready: ${agents.join(" → ")}`;
    }
    case "agent_called":
      return join(agent, step, "called");
    case "agent_working":
      return join(agent, step, data.call > 1 ? `call ${data.call}` : "working");
    case "agent_done":
      return join(agent, step,
        data.duration_seconds != null ? `done in ${data.duration_seconds}s` : "done");
    case "agent_failed":
      return join(agent, step, `failed${data.error_type ? `: ${data.error_type}` : ""}`);
    case "tool_requested":
      return join(agent, "requested", data.tool);
    case "tool_done":
      return `${data.tool} ${data.ok ? "ok" : "failed"}${data.truncated ? " · trimmed" : ""}`;
    case "search_done":
      return `Web search: ${data.results} results`;
    case "search_failed":
      return `Web search failed${data.error ? `: ${data.error}` : ""}`;
    case "approval_required":
      return "Approval required";
    case "awaiting_approval":
      return "Approval requested";
    case "revision_requested":
      return join(agent, step, "needs a revision");
    case "approval_decided":
      return data.decision === "approved" ? "Message approved" : "Message rejected";
    case "all_done":
      return `${sentenceCase(runStateLabel(data.status || "complete"))} in ${data.seconds}s`;
    case "run_failed":
      return `Run failed at ${data.failed_at}: ${data.error_type}`;
    case "stopped":
      return `Stopped: ${data.reason || ""}`.trim();
    case "logger_saved":
      return "Run saved";
    case "logger_failed":
      return "Run could not be saved";
    case "notifier_pending":
      return "Waiting for approval";
    case "notifier_sent":
      return "Message sent";
    case "notifier_skipped":
      return "Message not sent";
    case "notifier_failed":
      return `Message failed${data.error ? `: ${data.error}` : ""}`;
    default:
      return JSON.stringify(data).slice(0, 90);
  }
}


/* ------------------------------------------------------------------ */
/* View-model surface (pure; asserted from the browser console)        */
/* ------------------------------------------------------------------ */

const STATUS_BY_EVENT = {
  agent_called: "Called",
  agent_working: "Working",
  agent_done: "Done",
  agent_failed: "Failed",
};

function isPlannerEvent(data) {
  return data.agent === "sun" || data.step === 0;
}

function plannedSteps(data) {
  const steps = data.steps && data.steps.length
    ? data.steps
    : (data.agents || []).map((agent) => ({ agent, task: "" }));
  return steps.filter((item) => item.agent !== "sun");
}

function rosterOf(records) {
  const rows = new Map();
  const counted = new Set();
  let total = 0;
  let completed = 0;
  (records || []).forEach((record) => {
    const name = record.event;
    const data = record.data || {};
    if (name === "plan_ready") {
      const steps = plannedSteps(data);
      rows.clear();
      counted.clear();
      total = steps.length;
      completed = 0;
      steps.forEach((item, index) => {
        rows.set(`${index + 1}:${item.agent}`, {
          step: index + 1,
          agent: item.agent,
          task: item.task || "",
          status: "Idle",
          accent: styleFor(item.agent).color,
        });
      });
      return;
    }
    // run_failed is the only event for orchestration-level failures: it names
    // the agent in failed_at and has no step, so match the row by agent.
    if (name === "run_failed") {
      const row = [...rows.values()].find((item) => item.agent === data.failed_at);
      if (row) row.status = "Failed";
      return;
    }
    const status = STATUS_BY_EVENT[name];
    if (!status || isPlannerEvent(data)) return;
    let row;
    if (data.step != null) {
      // System (logger/notifier) and revision steps are not in plan_ready:
      // give each its own row instead of restyling an older row by agent.
      const key = `${data.step}:${data.agent}`;
      row = rows.get(key);
      if (!row) {
        row = {
          step: data.step,
          agent: data.agent,
          task: "",
          status: "Idle",
          accent: styleFor(data.agent).color,
        };
        rows.set(key, row);
        total += 1;
      }
    } else {
      row = [...rows.values()].find((item) => item.agent === data.agent);
    }
    if (!row) return;
    if (name === "agent_done" && !counted.has(row.step)) {
      counted.add(row.step);
      completed += 1;
    }
    if (row.status !== "Failed") row.status = status;
  });
  const ordered = [...rows.values()].sort((a, b) => a.step - b.step);
  ordered.forEach((row, index) => { row.seq = index + 1; });
  return { rows: ordered, completed, total };
}

function recordTime(record) {
  const stamp = Date.parse(record.ts);
  return Number.isFinite(stamp) ? new Date(stamp).toLocaleTimeString([], { hour12: false }) : "";
}

/* Stored runs carry UTC stamps; the picker matches the feed's local clock. */
function localStamp(value) {
  const stamp = Date.parse(value);
  if (!Number.isFinite(stamp)) return String(value || "").slice(5, 16);
  const date = new Date(stamp);
  const pad = (part) => String(part).padStart(2, "0");
  return `${pad(date.getMonth() + 1)}-${pad(date.getDate())} ` +
    `${pad(date.getHours())}:${pad(date.getMinutes())}`;
}

window.SolO = {
  summary(records) {
    return rosterOf(records);
  },
  roster(records) {
    return rosterOf(records).rows;
  },
  progress(records) {
    const { completed, total } = rosterOf(records);
    return { completed, total };
  },
  feed(records) {
    return (records || []).map((record) =>
      feedLine(record.event, record.data || {}, recordTime(record)));
  },
  accent(agent) {
    return styleFor(String(agent)).color;
  },
  runState(status) {
    return runStateLabel(status);
  },
  replay() {
    return {
      active: !replayControls.classList.contains("hidden"),
      paused: replayPlayer.paused,
      rate: replayPlayer.rate,
      index: replayPlayer.index,
      total: replayPlayer.records.length,
    };
  },
};

/* ------------------------------------------------------------------ */
/* Roster panel (renders window.SolO's view model; no second derivation)*/
/* ------------------------------------------------------------------ */

const AGENT_ROLE = {
  researcher: "Research", writer: "Draft", checker: "Review",
  logger: "Log", notifier: "Notify",
};

function renderRoster() {
  // The rows are rebuilt on every event; keep keyboard focus on the same row.
  const focused = document.activeElement;
  const rowEl = focused && focused.closest ? focused.closest("#roster-rows .row[data-agent]") : null;
  const focusKey = rowEl ? { step: rowEl.dataset.step, agent: rowEl.dataset.agent } : null;
  const { rows, completed, total } = window.SolO.summary(state.records);
  rosterCount.textContent = total ? `${completed} of ${total} complete` : "";
  if (!rows.length) {
    rosterRows.innerHTML = '<p class="empty">' + (state.records.length
      ? "Waiting for the Sun's plan…"
      : "Start a run to see its plan.") + "</p>";
    return;
  }
  rosterRows.innerHTML = rows.map((row) => {
    const status = row.status;
    const role = AGENT_ROLE[row.agent] || row.task || "agent";
    const state_ = status.toLowerCase();
    const step = String(row.seq).padStart(2, "0");
    return `<div class="row ${state_}" style="--row-accent:${row.accent}" role="button" tabindex="0"` +
      ` data-step="${row.step}" data-agent="${escapeHtml(row.agent)}"` +
      ` aria-label="Open ${escapeHtml(row.agent)} step ${row.seq} details, ${status}">` +
      `<span class="step" aria-hidden="true">${step}</span><div>` +
      `<div class="nm"><i class="dot" aria-hidden="true"></i>` +
      `<span class="agent">${escapeHtml(row.agent)}</span>` +
      `<span class="status ${state_}">${status}</span></div>` +
      `<div class="role">${escapeHtml(role.slice(0, 46))}</div>` +
      `</div></div>`;
  }).join("");
  if (focusKey) {
    const same = rosterRows.querySelector(
      `.row[data-step="${focusKey.step}"][data-agent="${CSS.escape(focusKey.agent)}"]`);
    if (same) same.focus();
  }
}

/* ------------------------------------------------------------------ */
/* Planets                                                             */
/* ------------------------------------------------------------------ */

function orbitRadius(index) {
  const width = stageRect.width || W;
  const height = stageRect.height || H;
  const span = Math.min(width, height * 1.6);
  const raw = Math.max(56, span * 0.16 + index * span * 0.052);
  // Never let an outer orbit leave the stage horizontally.
  return Math.min(raw, Math.max(56, width / 2 - 24));
}

function planetFor(step, agent, placeholder) {
  const key = `${step}:${agent}`;
  let planet = state.planets.get(key);
  if (planet) return planet;
  const style = styleFor(agent);
  const planIndex = state.plans.findIndex(
    (plan) => plan.step === step && plan.agent === agent
  );
  const orbitIndex = planIndex >= 0 ? planIndex : state.plans.length + state.extraPlanets;
  if (planIndex < 0) state.extraPlanets += 1;
  planet = {
    step,
    agent,
    orbitIndex,
    color: style.color,
    size: style.size,
    // Orbits fan across the top so the Sun and its state caption stay clear.
    angle: -Math.PI / 2 + ((orbitIndex % 5) - 2) * (Math.PI / 5),
    placeholder: Boolean(placeholder),
    skipped: false,
    working: false,
    done: false,
    failed: false,
    summary: "",
    attempts: 1,
    calls: 1,
    error: "",
    sx: 0,
    sy: 0,
  };
  state.planets.set(key, planet);
  return planet;
}

let sceneToken = 0;
/* Bumped whenever a decision clears the gate, so a restore that began
   before the decision can never reopen it. */
let decisionCounter = 0;

function resetScene() {
  sceneToken += 1;
  clearTimeout(resultTimer);
  resultTimer = 0;
  state.plans = [];
  state.planets.clear();
  state.alignPhase = null;
  state.alignAmount = 0;
  // A new run or replay owns the scene. Drop any older gate: a stale pending
  // action must never become a live decision for the run now on screen.
  state.pending = null;
  approvalBox.classList.add("hidden");
  state.outputs = null;
  state.outputsRun = null;
  state.detailData = null;
  state.detailRun = null;
  state.lastSeconds = null;
  state.lastStopReason = "";
  state.lastFailure = null;
  state.lastResultStatus = null;
  state.extraPlanets = 0;
  state.log = [];
  state.records = [];
  panel.classList.add("hidden");
  outputBox.classList.add("hidden");
  setModal(false);
  renderLog();
  renderRoster();
  syncDecisionGate();
  setSun("idle", "");
  requestFrame();
}

/* The gate's decisions are live controls only for a live run. */
let deciding = false;
function syncDecisionGate() {
  const replay = state.mode === "replay";
  approveBtn.disabled = replay || deciding;
  rejectBtn.disabled = replay || deciding;
  approvalBox.classList.toggle("replay", replay);
  if (replay) approvalBox.removeAttribute("aria-modal");
  else approvalBox.setAttribute("aria-modal", "true");
  approvalHeading.textContent = replay ? "Stored approval request" : "Approval required";
  approvalExplain.textContent = replay
    ? "Nothing has been sent. This stored gate is read-only and offers no decision."
    : "Nothing has been sent. Approving sends the stored message once. Rejecting ends this action.";
  approvalLabel.textContent = deciding ? "Sending your decision…" : "";
}

/* Drop the gate without deciding anything. */
function clearPendingGate() {
  decisionCounter += 1;
  state.pending = null;
  approvalBox.classList.add("hidden");
}

/* A reload or a second tab must still find a pending action: seed the gate
   from the backend, not just from a live SSE event. */
async function restorePending() {
  if (state.pending || state.mode !== "live") return;
  const token = sceneToken;
  const decision = decisionCounter;
  try {
    const response = await fetch("/pending");
    if (!response.ok) return;
    const rows = await response.json();
    // The run, replay, or approval decision may have changed while this
    // fetch was in flight; a stale row must not reopen a cleared gate.
    if (token !== sceneToken || decision !== decisionCounter ||
        state.mode !== "live" || state.pending) return;
    if (!Array.isArray(rows) || !rows.length) return;
    const row = state.follow
      ? [...rows].reverse().find((item) => item.run_id === state.follow)
      : rows[rows.length - 1];
    if (!row) return;
    const message = String((row.payload && row.payload.message) || "");
    state.pending = { id: row.id, runId: row.run_id, preview: message };
    approvalPreview.textContent = message || `Pending action #${row.id}`;
    approvalBox.classList.remove("hidden");
    setSun("awaiting", "decision needed");
    syncDecisionGate();
  } catch (error) {
    /* the gate is best-effort; the CLI can always decide */
  }
}

/* ------------------------------------------------------------------ */
/* Event application (live and replay share this)                      */
/* ------------------------------------------------------------------ */

function applyEvent(record) {
  const name = record.event;
  const data = record.data || {};
  if (record.run_id) state.runId = record.run_id;
  const plannerEvent = isPlannerEvent(data);

  switch (name) {
    case "run_started": {
      if (state.follow !== record.run_id) {
        state.follow = record.run_id;
        resetScene();
        state.runId = record.run_id;
      }
      setSun("orchestrating", "run started");
      break;
    }
    case "plan_ready": {
      const agents = data.agents || (data.steps || []).map((item) => item.agent);
      state.plans = agents.map((agent, index) => ({ step: index + 1, agent }));
      state.planets.clear();
      state.extraPlanets = 0;
      state.plans.forEach((plan) => planetFor(plan.step, plan.agent, true));
      setSun("planning", `${agents.length} steps planned`);
      break;
    }
    case "agent_called": {
      if (plannerEvent) break;
      const planet = planetFor(data.step, data.agent, false);
      planet.placeholder = false;
      setSun("orchestrating", `${data.agent} called`);
      break;
    }
    case "agent_working": {
      if (plannerEvent) {
        setSun("planning", "planner working");
        break;
      }
      const planet = planetFor(data.step, data.agent, false);
      planet.working = true;
      planet.calls = Math.max(planet.calls, data.call || 1);
      setSun("orchestrating", `${data.agent} working${planet.calls > 1 ? " · call " + planet.calls : ""}`);
      break;
    }
    case "agent_done": {
      if (plannerEvent) break;
      const planet = planetFor(data.step, data.agent, false);
      planet.working = false;
      planet.done = true;
      planet.summary = data.summary || "";
      if (data.attempts) planet.attempts = data.attempts;
      break;
    }
    case "agent_failed": {
      if (plannerEvent) {
        setSun("failed", data.error_type || "failed");
        break;
      }
      const planet = planetFor(data.step, data.agent, false);
      planet.working = false;
      planet.failed = true;
      planet.error = `${data.error_type || data.error || "error"}: ${data.message || ""}`.trim();
      setSun("failed", data.error_type || "failed");
      break;
    }
    case "awaiting_approval": {
      state.pending = {
        id: data.pending_id,
        runId: record.run_id || state.follow,
        preview: data.preview || "",
      };
      approvalPreview.textContent = data.preview || `Pending action #${data.pending_id}`;
      approvalBox.classList.remove("hidden");
      // Never yank focus into a replay's read-only gate.
      if (state.mode !== "replay") approveBtn.focus();
      setSun("awaiting", "decision needed");
      break;
    }
    case "approval_decided": {
      // Also retires any restore that was already in flight.
      clearPendingGate();
      refreshRuns();
      const runStatus = data.run_status || (data.decision === "approved" ? "complete" : "rejected");
      if (data.decision === "approved" && runStatus === "complete") {
        setSun("complete", "approved");
        startAlignment();
      } else if (data.decision === "approved") {
        setSun(runStatus, "approved");
      } else {
        setSun("rejected", data.decision);
      }
      autoResult(data.decision === "approved" ? runStatus : "rejected");
      break;
    }
    case "all_done": {
      state.lastSeconds = data.seconds != null ? data.seconds : null;
      if (data.status === "complete") {
        setSun("complete", `finished in ${data.seconds}s`);
        startAlignment();
      } else {
        markSkipped();
        setSun(data.status || "complete", data.status || "");
      }
      autoResult(data.status);
      refreshRuns();
      break;
    }
    case "tool_requested": {
      setSun("orchestrating", `${data.agent} → ${data.tool}`);
      break;
    }
    case "tool_done": {
      const trimmed = data.truncated ? " · trimmed" : "";
      setSun("orchestrating", `${data.tool} ${data.ok ? "done" : "failed"}${trimmed}`);
      break;
    }
    case "stopped": {
      state.lastStopReason = data.reason || "";
      markSkipped();
      break;
    }
    case "run_failed": {
      state.lastFailure = data;
      const failed = [...state.planets.values()].find((planet) => planet.agent === data.failed_at);
      if (failed) {
        failed.failed = true;
        failed.working = false;
        failed.error = `${data.error_type}: ${data.message || ""}`;
      }
      setSun("failed", data.error_type || "failed");
      autoResult("failed", data);
      refreshRuns();
      break;
    }
    default:
      break;
  }
  pushLog(name, data, recordTime(record) || undefined);
  state.records.push(record);
  renderRoster();
  syncDecisionGate();
  requestFrame();
}

function markSkipped() {
  for (const planet of state.planets.values()) {
    if (planet.placeholder && !planet.done && !planet.failed && !planet.working) {
      planet.skipped = true;
    }
  }
}

function startAlignment() {
  if (reduceMotion) {
    // Snap into line: no travel and no timed phase.
    state.alignPhase = null;
    state.alignStart = 0;
    state.alignAmount = 1;
    requestFrame();
    return;
  }
  state.alignPhase = "in";
  state.alignStart = performance.now();
  state.alignAmount = 0;
  requestFrame();
}

/* ------------------------------------------------------------------ */
/* Live SSE                                                            */
/* ------------------------------------------------------------------ */

const BOOT_AT = Date.now();

function handleLive(record) {
  if (state.mode !== "live") return;
  // Skip the historical backlog a fresh tab receives; keep anything from this page's lifetime.
  const stamp = Date.parse(record.ts);
  if (state.follow === null && Number.isFinite(stamp) && stamp < BOOT_AT - 2500) return;
  if (!state.follow) {
    state.follow = record.run_id;
    state.runId = record.run_id;
  }
  if (record.run_id !== state.follow) return;
  applyEvent(record);
}

function connectStream() {
  const source = new EventSource("/stream");
  source.onmessage = (message) => {
    try {
      handleLive(JSON.parse(message.data));
    } catch (error) {
      console.warn("bad event", error);
    }
  };
  source.onopen = () => {
    /* A reconnect can miss the awaiting_approval event: re-seed from /pending. */
    restorePending();
  };
  source.onerror = () => {
    /* EventSource reconnects and replays via Last-Event-ID automatically. */
  };
}

/* ------------------------------------------------------------------ */
/* Run / replay / approvals                                            */
/* ------------------------------------------------------------------ */

async function startRun() {
  const task = taskInput.value.trim();
  if (!task) {
    taskInput.focus();
    return;
  }
  clearReplayTimers();
  state.mode = "live";
  state.follow = null;
  state.runId = null;
  resetScene();
  setSun("orchestrating", "queued");

  try {
    const response = await fetch("/orchestrate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task }),
    });
    const body = await response.json();
    if (!response.ok) throw new Error(body.detail || body.error || "run rejected");
    state.follow = body.run_id;
    state.runId = body.run_id;
    pushLog("run_queued", { task: body.run_id });
  } catch (error) {
    setSun("failed", String(error.message || error));
    pushLog("error", { message: String(error.message || error) });
  }
}

/* Replay playback. One chained timer instead of a burst: pausing stops the
   single pending event and resuming re-arms it with its remaining delay, so
   no record is skipped or applied twice. */
const REPLAY_GAP_CAP = 1500;

const replayPlayer = {
  records: [],
  index: 0,          // index of the next record to apply
  timer: 0,
  paused: false,
  dueAt: 0,
  remaining: 0,
  rate: 1,
};

function clearReplayTimers() {
  if (replayPlayer.timer) clearTimeout(replayPlayer.timer);
  replayPlayer.timer = 0;
  replayPlayer.records = [];
  replayPlayer.index = 0;
  replayPlayer.paused = false;
  replayPlayer.remaining = 0;
  replayPlayer.rate = 1;
  setReplayControls(false);
}

function setReplayControls(visible) {
  replayControls.classList.toggle("hidden", !visible);
  syncReplayControls();
  syncHeaderHeight();
}

function syncReplayControls() {
  replayPause.textContent = replayPlayer.paused ? "Resume" : "Pause";
  replayPause.setAttribute("aria-pressed", String(replayPlayer.paused));
  replaySpeed.textContent = `${replayPlayer.rate}x`;
  replaySpeed.setAttribute("aria-pressed", String(replayPlayer.rate === 2));
}

function scheduleReplayStep(delay) {
  replayPlayer.remaining = delay;
  replayPlayer.dueAt = performance.now() + delay;
  replayPlayer.timer = setTimeout(runReplayStep, delay);
}

function runReplayStep() {
  replayPlayer.timer = 0;
  replayPlayer.remaining = 0;
  const record = replayPlayer.records[replayPlayer.index];
  if (!record) return;
  replayPlayer.index += 1;
  applyEvent(record);
  if (replayPlayer.index >= replayPlayer.records.length) {
    setReplayControls(false);
    return;
  }
  scheduleReplayStep(replayGap(replayPlayer.index));
}

function replayGap(index) {
  const current = replayPlayer.records[index];
  const previous = replayPlayer.records[index - 1];
  const delta = Date.parse(current.ts) - Date.parse(previous.ts);
  const gap = Number.isFinite(delta) ? clamp(delta, 0, REPLAY_GAP_CAP) : 0;
  return gap / replayPlayer.rate;   // 2x halves the 1500ms cap and every gap
}

function pauseReplay() {
  if (replayPlayer.paused) return;
  replayPlayer.paused = true;
  replayPlayer.remaining = replayPlayer.timer
    ? Math.max(0, replayPlayer.dueAt - performance.now())
    : 0;
  if (replayPlayer.timer) clearTimeout(replayPlayer.timer);
  replayPlayer.timer = 0;
  syncReplayControls();
}

function resumeReplay() {
  if (!replayPlayer.paused) return;
  replayPlayer.paused = false;
  syncReplayControls();
  scheduleReplayStep(replayPlayer.remaining);
}

function toggleReplayRate() {
  const next = replayPlayer.rate === 1 ? 2 : 1;
  // Keep the wall-clock position of the pending gap, then re-arm it at the new speed.
  const left = replayPlayer.timer
    ? Math.max(0, replayPlayer.dueAt - performance.now())
    : replayPlayer.remaining;
  const scaled = (left * replayPlayer.rate) / next;
  if (replayPlayer.timer) clearTimeout(replayPlayer.timer);
  replayPlayer.timer = 0;
  replayPlayer.rate = next;
  if (replayPlayer.paused) replayPlayer.remaining = scaled;
  else if (replayPlayer.records.length) scheduleReplayStep(scaled);
  syncReplayControls();
}

let replayToken = 0;

async function replayRun(runId) {
  if (!runId) return;
  const token = ++replayToken;
  const stale = () => token !== replayToken || state.mode !== "replay";
  clearReplayTimers();
  state.mode = "replay";
  state.follow = runId;
  state.runId = runId;
  resetScene();
  pillText.textContent = "Replay — Loading";
  pill.className = "working";

  try {
    const response = await fetch(`/runs/${runId}/events`);
    if (stale()) return;
    if (!response.ok) throw new Error("could not load events");
    const records = await response.json();
    if (stale()) return;
    if (!records.length) {
      pillText.textContent = "Replay — Empty";
      return;
    }
    replayPlayer.records = records;
    setReplayControls(true);
    scheduleReplayStep(0);
  } catch (error) {
    if (stale()) return;
    pillText.textContent = "Replay — Error";
    pill.className = "failed";
    pushLog("error", { message: String(error.message || error) });
  }
}

async function decide(kind) {
  if (!state.pending || state.mode === "replay" || deciding) return;
  const id = state.pending.id;
  deciding = true;
  syncDecisionGate();
  let terminalError = false;
  try {
    const response = await fetch(`/pending/${id}/${kind}`, { method: "POST" });
    const body = await response.json();
    if (!response.ok) {
      // Only a missing, already-decided, or unexecutable action is final.
      // Other failures leave the stored action decidable on a retry.
      terminalError = ["not_found", "conflict", "execution_failed"]
        .includes(String(body.error || ""));
      throw new Error(body.detail || body.error || "decision failed");
    }
    // The decision is final: close the gate now. approval_decided may belong
    // to a run this tab is not following and would be filtered out above.
    clearPendingGate();
    pushLog(`approval_${kind}`, { pending_id: id, status: body.status });
    refreshRuns();
  } catch (error) {
    pushLog("error", { message: String(error.message || error) });
    if (terminalError) {
      // Expired and already-decided actions can never succeed on retry, and a
      // blocking gate with no way out would trap the page.
      clearPendingGate();
      const message = String(error.message || error);
      setSun("failed", message.length > 90 ? `${message.slice(0, 89)}…` : message);
    }
  } finally {
    deciding = false;
    syncDecisionGate();
  }
}

async function refreshRuns() {
  try {
    const response = await fetch("/runs?limit=25");
    const rows = await response.json();
    const current = replaySelect.value;
    replaySelect.innerHTML = '<option value="">Replay a run…</option>' + rows.map((row) => {
      const when = localStamp(row.created_at);
      const label = `${when} · ${runStateLabel(row.status)} · ${(row.task || "").slice(0, 42)}`;
      return `<option value="${escapeHtml(row.id)}">${escapeHtml(label)}</option>`;
    }).join("");
    if (current) replaySelect.value = current;
  } catch (error) {
    /* the dropdown is best-effort */
  }
}

async function loadRunDetail(force) {
  if (!state.runId) throw new Error("No run id yet.");
  const runId = state.runId;
  if (!force && state.detailData && state.detailRun === runId) {
    return state.detailData;
  }
  const response = await fetch(`/runs/${runId}`);
  if (!response.ok) throw new Error("run has not been saved yet");
  const detail = await response.json();
  // Another run (or a replay) took over while this was in flight: don't cache it.
  if (state.runId !== runId) return null;
  state.detailData = detail;
  state.detailRun = runId;
  state.outputs = (detail.run && detail.run.outputs) || [];
  state.outputsRun = runId;
  return detail;
}

function lastWriterDraft(outputs) {
  for (let i = outputs.length - 1; i >= 0; i -= 1) {
    const item = outputs[i] || {};
    const out = item.output || {};
    if (item.agent === "writer" && out.draft) return String(out.draft);
  }
  return "";
}

function lastClarification(outputs) {
  for (let i = outputs.length - 1; i >= 0; i -= 1) {
    const out = (outputs[i] || {}).output || {};
    if (out.clarification_needed) return String(out.clarification_needed);
  }
  return "";
}

function lastCheckerIssues(outputs) {
  for (let i = outputs.length - 1; i >= 0; i -= 1) {
    const item = outputs[i] || {};
    if (item.agent !== "checker") continue;
    const issues = (item.output || {}).issues;
    if (Array.isArray(issues)) return issues;
  }
  return [];
}

let outputOpener = null;
let resultTimer = 0;

function autoResult(status, data) {
  clearTimeout(resultTimer);
  resultTimer = 0;
  const compact = window.matchMedia("(max-width: 1179.98px)").matches;
  // Below 1180px the result is full-screen: let the 5.4s alignment finish first.
  const wait = status === "complete" && compact && !reduceMotion ? 5600 : 0;
  if (!wait) {
    showResult(status, data);
    return;
  }
  resultTimer = setTimeout(() => {
    resultTimer = 0;
    showResult(status, data);
  }, wait);
}

function setMeta(field, value) {
  const text = value == null ? "" : String(value);
  field.textContent = text;
  field.parentElement.classList.toggle("hidden", !text);
}

function closeOutput() {
  outputBox.classList.add("hidden");
  setModal(false);
  const opener = outputOpener;
  outputOpener = null;
  if (opener && opener.isConnected) opener.focus();
}

async function showResult(status, data) {
  clearTimeout(resultTimer);
  resultTimer = 0;
  state.lastResultStatus = status;
  closeDrawer();
  if (!outputBox.contains(document.activeElement)) outputOpener = document.activeElement;
  outputBox.classList.remove("hidden");
  setModal(true);
  // A dialog only announces itself when it takes focus.
  outputBox.focus();
  outputBody.textContent = "loading…";
  setMeta(metaState, sentenceCase(runStateLabel(status)));
  setMeta(metaDuration, state.lastSeconds != null ? `${state.lastSeconds}s` : "");
  setMeta(metaVerdict, "");
  setMeta(metaRun, state.runId || "");

  let run = null;
  let outputs = [];
  try {
    const detail = await loadRunDetail(true);
    run = (detail && detail.run) || null;
    outputs = (run && run.outputs) || [];
  } catch (error) {
    /* fall back to what the event stream told us */
  }

  const seconds = state.lastSeconds != null ? state.lastSeconds : run ? run.duration_seconds : null;
  // State, duration, verdict and run id stay separate labelled values.
  setMeta(metaState, sentenceCase(runStateLabel(status)));
  setMeta(metaDuration, seconds != null ? `${seconds}s` : "");
  setMeta(metaVerdict,
    run && run.verdict ? sentenceCase(String(run.verdict).replace(/_/g, " ")) : "");
  setMeta(metaRun, state.runId || "");
  outputTitle.textContent = "Result";

  let text = "";
  if (status === "complete") {
    text = (run && run.final_draft) || lastWriterDraft(outputs) || "Run completed, but no draft was stored.";
  } else if (status === "partial") {
    text = (run && run.final_draft) || lastWriterDraft(outputs) || "(no draft)";
    const issues = lastCheckerIssues(outputs);
    if (issues.length) {
      text += "\n\nChecker issues:\n" + issues.map((issue) => {
        const where = issue.location ? ` (${issue.location})` : "";
        const fix = issue.suggestion ? `\n   → ${issue.suggestion}` : "";
        return `• ${issue.problem}${where}${fix}`;
      }).join("\n");
    }
  } else if (status === "needs_clarification") {
    text = lastClarification(outputs) || state.lastStopReason
      || (data && data.message) || "The agent needs more information.";
    const draft = lastWriterDraft(outputs);
    if (draft) text += "\n\nDraft so far:\n" + draft;
  } else if (status === "rejected") {
    text = "Rejected. Nothing was sent.";
    const draft = (run && run.final_draft) || lastWriterDraft(outputs);
    if (draft) text += "\n\nDraft (not sent):\n" + draft;
  } else if (status === "failed") {
    const failure = state.lastFailure || {};
    text = [failure.error_type, failure.failed_at ? `at ${failure.failed_at}` : "", failure.message]
      .filter(Boolean).join(" · ") || "Run failed.";
  } else {
    text = `Status: ${runStateLabel(status)}`;
  }

  outputBody.textContent = text;
  outputBody.scrollTop = 0;
}

/* ------------------------------------------------------------------ */
/* Agent drawer (opened by a planet click or a roster row activation)  */
/* ------------------------------------------------------------------ */

let drawerOpener = null;
let drawerOpenerKey = null;
let drawerToken = 0;
let drawerHadResult = false;

const STATUS_TONE = {
  Idle: "var(--muted)", Called: "var(--info)", Working: "var(--accent)",
  Done: "var(--success)", Failed: "var(--error)",
};

function planetStatus(planet) {
  if (planet.failed) return "Failed";
  if (planet.done) return "Done";
  if (planet.working) return "Working";
  return planet.placeholder ? "Idle" : "Called";
}

/* Role, task and duration come from the same records the roster uses. */
function drawerFacts(step, agent) {
  // The header chip must use the roster's vocabulary and status, not a second
  // derivation of the planet flags.
  const row = window.SolO.roster(state.records)
    .find((item) => item.step === step && item.agent === agent);
  let task = row ? row.task : "";
  let duration = "";
  let calledAt = 0;
  let endedAt = 0;
  (state.records || []).forEach((record) => {
    const data = record.data || {};
    const matches = data.agent === agent && (data.step == null || data.step === step);
    if (record.event === "plan_ready" && !task) {
      const steps = data.steps || [];
      const item = steps[step - 1] && steps[step - 1].agent === agent
        ? steps[step - 1]
        : steps.find((entry) => entry.agent === agent);
      if (item && item.task) task = item.task;
    }
    if (record.event === "agent_called" && matches) calledAt = Date.parse(record.ts);
    if (record.event === "agent_done" && matches) {
      endedAt = Date.parse(record.ts);
      if (data.duration_seconds != null) duration = `${data.duration_seconds}s`;
    }
    if (record.event === "agent_failed" && matches) endedAt = Date.parse(record.ts);
  });
  if (!duration && calledAt && endedAt && endedAt >= calledAt) {
    duration = `${((endedAt - calledAt) / 1000).toFixed(1)}s`;
  }
  const planet = state.planets.get(`${step}:${agent}`);
  const status = row ? row.status : planet ? planetStatus(planet) : duration ? "Done" : "Called";
  return { task, duration, status };
}

async function loadDrawerOutput(step, agent, token) {
  const planet = state.planets.get(`${step}:${agent}`);
  if (!state.runId) {
    panelOutput.textContent = "No run id yet.";
    return;
  }
  try {
    const detail = await loadRunDetail(!state.outputs || !state.outputs.length);
    if (!detail || token !== drawerToken) return;
    const outputs = (detail.run && detail.run.outputs) || [];
    const found =
      outputs.find((item) => item.step === step && item.agent === agent) ||
      outputs.find((item) => item.agent === agent);
    panelOutput.textContent = JSON.stringify(
      found ? (found.output !== undefined ? found.output : found) : {
        agent,
        step,
        status: planet && planet.failed ? "failed" : planet && planet.done ? "complete" : "working",
        summary: planet && planet.summary,
        error: (planet && planet.error) || undefined,
      },
      null,
      2
    );
  } catch (error) {
    if (token !== drawerToken) return;
    panelOutput.textContent = String(error.message || error);
  }
}

function openDrawer(step, agent, opener) {
  drawerOpener = opener || null;
  drawerOpenerKey = opener && opener.classList && opener.classList.contains("row") ? { step, agent } : null;
  const token = ++drawerToken;
  const facts = drawerFacts(step, agent);
  const status = facts.status;
  tooltip.classList.add("hidden");
  panelTitle.textContent = `${agent} · step ${step}`;
  panelStatus.textContent = status;
  panelStatus.className = status.toLowerCase();
  panelRole.textContent = AGENT_ROLE[agent] || facts.task || "agent";
  panelTask.textContent = facts.task || "—";
  panelDuration.textContent = facts.duration ||
    (status === "Working" || status === "Called" ? "in progress" : "—");
  panelOutput.textContent = "loading…";
  drawerHadResult = !outputBox.classList.contains("hidden");
  panel.classList.remove("hidden");
  outputBox.classList.add("hidden");
  setModal(true);
  panelClose.focus();
  loadDrawerOutput(step, agent, token);
}

function closeDrawer() {
  if (panel.classList.contains("hidden")) return;
  drawerToken += 1;
  panel.classList.add("hidden");
  const restoreResult = drawerHadResult;
  drawerHadResult = false;
  if (restoreResult) {
    outputBox.classList.remove("hidden");
    setModal(true);
  } else {
    setModal(false);
  }
  const key = drawerOpenerKey;
  let opener = drawerOpener;
  drawerOpener = null;
  drawerOpenerKey = null;
  // Roster rows are re-rendered on every event, so fall back to the same row.
  if (key && (!opener || !opener.isConnected)) {
    opener = rosterRows.querySelector(`.row[data-step="${key.step}"][data-agent="${CSS.escape(key.agent)}"]`);
  }
  // A restored result can hide the opener on mobile; keep focus visible then.
  if (opener && opener.isConnected && opener.getClientRects().length) opener.focus();
  else if (restoreResult) outputBox.focus();
}

/* ------------------------------------------------------------------ */
/* Rendering                                                           */
/* ------------------------------------------------------------------ */

const SUN_RADIUS = 18;
const PLANET_LABEL_FONT = "600 12px 'Space Grotesk', system-ui, sans-serif";
const PLANET_MONO_FONT = "400 11px 'JetBrains Mono', ui-monospace, monospace";

let rafId = null;

/* Render on demand: without ambient motion only the completion alignment
   needs a frame loop, so an idle or finished console draws once per change. */
function requestFrame() {
  if (rafId === null) rafId = requestAnimationFrame(frame);
}

function frame(now) {
  rafId = null;
  const animating = updateAnimation(now);
  draw();
  if (animating) requestFrame();
}

function draw() {
  ctx.fillStyle = P.bg;
  ctx.fillRect(0, 0, W, H);
  drawOrbitRings();
  for (const planet of state.ordered) drawPlanet(planet, planet.px, planet.py);
  drawSun();
}

function drawOrbitRings() {
  ctx.strokeStyle = P.line;
  ctx.lineWidth = 1;
  // System and revision planets can sit beyond the planned rings.
  const planets = [...state.planets.values()];
  const rings = Math.max(
    state.plans.length,
    ...planets.map((planet) => planet.orbitIndex + 1),
    0
  );
  for (let index = 0; index < rings; index += 1) {
    const radius = orbitRadius(index);
    ctx.beginPath();
    ctx.ellipse(CX, CY, radius, radius * 0.55, 0, 0, TAU);
    ctx.stroke();
  }
}

/* Fit canvas copy inside the stage without letting a long detail escape it. */
function fitText(text, maxWidth) {
  if (ctx.measureText(text).width <= maxWidth) return text;
  let out = text;
  while (out.length > 1 && ctx.measureText(`${out}…`).width > maxWidth) {
    out = out.slice(0, -1);
  }
  return `${out}…`;
}

function drawSun() {
  ctx.fillStyle = P.accent;
  ctx.beginPath();
  ctx.arc(CX, CY, SUN_RADIUS, 0, TAU);
  ctx.fill();

  const maxWidth = Math.max(160, (stageRect.width || W) - 32);
  const label = runStateLabel(state.pending ? "waiting for approval" : state.sun);
  const caption = state.sun === "idle" && !state.detail ? "Ready for a task" : sentenceCase(label);

  ctx.textAlign = "center";
  ctx.fillStyle = P.muted;
  ctx.font = "600 12px 'Space Grotesk', system-ui, sans-serif";
  ctx.fillText("Sol-O", CX, CY + SUN_RADIUS + 30);

  ctx.fillStyle = P.fg;
  ctx.font = "500 20px 'Space Grotesk', system-ui, sans-serif";
  ctx.fillText(fitText(caption, maxWidth), CX, CY + SUN_RADIUS + 56);

  const detail = runDetailText(label, state.detail);
  if (detail) {
    ctx.fillStyle = P.muted;
    ctx.font = "400 12px 'Space Grotesk', system-ui, sans-serif";
    ctx.fillText(fitText(detail, maxWidth), CX, CY + SUN_RADIUS + 78);
  }
  ctx.textAlign = "left";
}

function drawPlanet(planet, x, y) {
  ctx.globalAlpha = planet.skipped ? 0.35 : 1;
  ctx.fillStyle = planet.color;
  ctx.beginPath();
  ctx.arc(x, y, planet.size, 0, TAU);
  ctx.fill();

  if (planet.failed) {
    const arm = planet.size * 0.55;
    ctx.strokeStyle = P.bg;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(x - arm, y - arm);
    ctx.lineTo(x + arm, y + arm);
    ctx.moveTo(x + arm, y - arm);
    ctx.lineTo(x - arm, y + arm);
    ctx.stroke();
  }

  if (planet.attempts > 1) {
    ctx.fillStyle = P.muted;
    ctx.font = PLANET_MONO_FONT;
    ctx.textAlign = "center";
    ctx.fillText(`attempt ${planet.attempts}`, x, y - planet.size - 10);
  }

  // While the completion alignment holds, labels would cover the Sun caption.
  if (state.alignAmount < 0.01) {
    ctx.fillStyle = P.muted;
    ctx.font = PLANET_LABEL_FONT;
    ctx.textAlign = "center";
    ctx.fillText(planet.agent, x, y + planet.size + 17);
    ctx.textAlign = "left";
  }
  ctx.globalAlpha = 1;
}

function updateAnimation(now) {
  if (state.alignPhase === "in") {
    const t = clamp((now - state.alignStart) / 1200, 0, 1);
    state.alignAmount = easeInOut(t);
    if (t >= 1) {
      state.alignPhase = "hold";
      state.alignStart = now;
    }
  } else if (state.alignPhase === "hold") {
    state.alignAmount = 1;
    if (now - state.alignStart > 3000) {
      state.alignPhase = "out";
      state.alignStart = now;
    }
  } else if (state.alignPhase === "out") {
    const t = clamp((now - state.alignStart) / 1200, 0, 1);
    state.alignAmount = 1 - easeInOut(t);
    if (t >= 1) {
      state.alignPhase = null;
      state.alignAmount = 0;
    }
  }

  const list = [...state.planets.values()];
  const amount = state.alignAmount > 0.001 ? easeInOut(state.alignAmount) : 0;
  if (amount > 0) {
    // Slots are computed once per frame, not once per lookup.
    for (const planet of list) planet.alignX = null;
    const lined = list.slice().sort((a, b) => a.step - b.step);
    const spacing = Math.min(
      150,
      ((stageRect.width || W) * 0.38) / Math.max(1, Math.ceil(lined.length / 2))
    );
    lined.forEach((planet, index) => {
      const slot = Math.floor(index / 2) + 0.5;
      planet.alignX = CX + (index % 2 === 0 ? 1 : -1) * slot * spacing;
      planet.alignY = CY;
    });
  }

  for (const planet of list) {
    const index = planet.orbitIndex != null ? planet.orbitIndex : list.length;
    const radius = orbitRadius(index);
    const bx = CX + Math.cos(planet.angle) * radius;
    const by = CY + Math.sin(planet.angle) * radius * 0.55;
    planet.px = planet.alignX != null ? bx + (planet.alignX - bx) * amount : bx;
    planet.py = planet.alignY != null ? by + (planet.alignY - by) * amount : by;
    // Pointer hit testing reads the drawn position.
    planet.sx = planet.px;
    planet.sy = planet.py;
  }
  list.sort((a, b) => a.py - b.py);
  state.ordered = list;
  return state.alignPhase !== null;
}

/* ------------------------------------------------------------------ */
/* Pointer interaction                                                 */
/* ------------------------------------------------------------------ */

canvas.addEventListener("mousemove", (event) => {
  canvas.style.cursor = "default";
  let found = null;
