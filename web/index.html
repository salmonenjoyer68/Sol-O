const tabRoster = document.getElementById("tab-roster");
const tabFeed = document.getElementById("tab-feed");

/* ------------------------------------------------------------------ */
/* Small helpers                                                       */
/* ------------------------------------------------------------------ */

const clamp = (value, lo, hi) => Math.min(hi, Math.max(lo, value));
const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[ch]));
}

/* One run-state vocabulary for the pill, the Sun and the result meta. */
const RUN_STATE_LABEL = {
  orchestrating: "running",
  working: "running",
  awaiting: "waiting for approval",
  awaiting_approval: "waiting for approval",
};
const RUN_STATE_TONE = {
  planning: "planning",
  running: "working",
  "waiting for approval": "awaiting",
  complete: "complete",
  partial: "warn",
  "needs clarification": "warn",
  rejected: "failed",
  failed: "failed",
};

function runStateLabel(status) {
  const key = String(status == null ? "" : status).trim().toLowerCase()
    .replace(/[\s_-]+/g, "_").replace(/^_+|_+$/g, "");
  return RUN_STATE_LABEL[key] || key.replace(/_/g, " ") || "idle";
}

/* A detail that repeats the state would read as a second state. */
function runDetailText(label, detail) {
  const text = String(detail || "").trim();
  return runStateLabel(text) === label ? "" : text;
}

function setSun(status, detail) {
  // While an approval is pending, worker/tool events must not hide the gate.
  if (state.pending && (status === "orchestrating" || status === "planning")) status = "awaiting";
  state.sun = status;
  state.detail = detail || "";
  const label = runStateLabel(status);
  pillText.textContent = (state.mode === "replay" ? "REPLAY · " : "") + label.toUpperCase();
  pill.className = "pill " + (RUN_STATE_TONE[label] || "");
}

function showPlanCount(count) {
  planCount.textContent = `${count} agent${count === 1 ? "" : "s"} planned`;
  planCount.classList.remove("hidden");
}

function feedLine(name, data, time) {
  const ok = data && data.ok;
  return {
    time: time != null ? time : new Date().toLocaleTimeString([], { hour12: false }),
    name,
    text: summariseEvent(name, data),
    agent: (data && data.agent) || "",
    accent: data && data.agent ? styleFor(data.agent).color : null,
    failed: /fail|error/i.test(name) || (name === "tool_done" && ok === false),
  };
}

function pushLog(name, data, time) {
  state.log.push(feedLine(name, data, time));
  if (state.log.length > 40) {
    state.log.shift();
    // Mirror the trim in the DOM so renderLog only appends what is new.
    if (logLines.firstElementChild) logLines.firstElementChild.remove();
  }
  renderLog();
}

function logLineHtml(item) {
  // Only genuine completion is a done line: partial/clarification all_done is neutral.
  const done = !item.failed && (item.name === "agent_done" ||
    (item.name === "all_done" && /^complete\b/i.test(item.text)));
  const who = item.agent || item.name;
  const rest = item.agent ? `${item.name} · ${item.text}` : item.text;
  return `<div class="line${item.failed ? " failed" : done ? " done" : ""}"` +
    ` style="--dot:${item.accent || "#a39a89"}">` +
    `<time>${escapeHtml(item.time)}</time><i class="dot"></i>` +
    `<span class="who">${escapeHtml(who)}</span>` +
    `<span class="what">${escapeHtml(rest)}</span></div>`;
}

function renderLog() {
  // Append-only: rebuilding innerHTML would re-announce the whole feed.
  while (logLines.childElementCount > state.log.length) logLines.firstElementChild.remove();
  state.log.slice(logLines.childElementCount).forEach((item) =>
    logLines.insertAdjacentHTML("beforeend", logLineHtml(item)));
  // Newest line at the bottom; assigning scrollTop moves nothing else.
  logLines.scrollTop = logLines.scrollHeight;
}

function summariseEvent(name, data) {
  if (!data) return "";
  if (name === "tool_done") {
    const step = data.step != null ? `#${data.step} ` : "";
    const agent = data.agent ? `${data.agent} ` : "";
    const trimmed = data.truncated ? " · trimmed" : "";
    return `${step}${agent}${data.tool} ${data.ok ? "ok" : "failed"}${trimmed}`;
  }
  if (data.agent) {
    const step = data.step != null ? `#${data.step} ` : "";
    const extra = data.status || data.error_type || (data.call ? `call ${data.call}` : "");
    return `${step}${data.agent}${extra ? " " + extra : ""}`;
  }
  if (name === "run_started") return String(data.task || "").slice(0, 90);
  if (name === "plan_ready") return (data.agents || []).join(" → ");
  if (name === "awaiting_approval") return `pending #${data.pending_id}`;
  if (name === "approval_decided") return `${data.decision} #${data.pending_id}`;
  if (name === "all_done") return `${data.status} in ${data.seconds}s`;
  if (name === "run_failed") return `${data.error_type} at ${data.failed_at}`;
  if (name === "search_done") return `${data.results} results`;
  return JSON.stringify(data).slice(0, 90);
}

/* ------------------------------------------------------------------ */
/* View-model surface (pure; asserted from the browser console)        */
/* ------------------------------------------------------------------ */

const STATUS_BY_EVENT = {
  agent_called: "Called",
  agent_working: "Working",
  agent_done: "Done",
  agent_failed: "Failed",
};

function isPlannerEvent(data) {
  return data.agent === "sun" || data.step === 0;
}

function plannedSteps(data) {
  const steps = data.steps && data.steps.length
    ? data.steps
    : (data.agents || []).map((agent) => ({ agent, task: "" }));
  return steps.filter((item) => item.agent !== "sun");
}

function rosterOf(records) {
  const rows = new Map();
  const counted = new Set();
  let total = 0;
  let completed = 0;
  (records || []).forEach((record) => {
    const name = record.event;
    const data = record.data || {};
    if (name === "plan_ready") {
      const steps = plannedSteps(data);
      rows.clear();
      counted.clear();
      total = steps.length;
      completed = 0;
      steps.forEach((item, index) => {
        rows.set(`${index + 1}:${item.agent}`, {
          step: index + 1,
          agent: item.agent,
          task: item.task || "",
          status: "Idle",
          accent: styleFor(item.agent).color,
        });
      });
      return;
    }
    // run_failed is the only event for orchestration-level failures: it names
    // the agent in failed_at and has no step, so match the row by agent.
    if (name === "run_failed") {
      const row = [...rows.values()].find((item) => item.agent === data.failed_at);
      if (row) row.status = "Failed";
      return;
    }
    const status = STATUS_BY_EVENT[name];
    if (!status || isPlannerEvent(data)) return;
    const row = rows.get(`${data.step}:${data.agent}`) ||
      [...rows.values()].find((item) => item.agent === data.agent);
    if (!row) return;
    if (name === "agent_done" && !counted.has(row.step)) {
      counted.add(row.step);
      completed += 1;
    }
    if (row.status !== "Failed") row.status = status;
  });
  return { rows: [...rows.values()], completed, total };
}

function recordTime(record) {
  const stamp = Date.parse(record.ts);
  return Number.isFinite(stamp) ? new Date(stamp).toLocaleTimeString([], { hour12: false }) : "";
}

window.SolO = {
  roster(records) {
    return rosterOf(records).rows;
  },
  progress(records) {
    const { completed, total } = rosterOf(records);
    return { completed, total };
  },
  feed(records) {
    return (records || []).map((record) =>
      feedLine(record.event, record.data || {}, recordTime(record)));
  },
  accent(agent) {
    return styleFor(String(agent)).color;
  },
  runState(status) {
    return runStateLabel(status);
  },
  replay() {
    return {
      active: !replayControls.classList.contains("hidden"),
      paused: replayPlayer.paused,
      rate: replayPlayer.rate,
      index: replayPlayer.index,
      total: replayPlayer.records.length,
    };
  },
};

/* ------------------------------------------------------------------ */
/* Roster panel (renders window.SolO's view model; no second derivation)*/
/* ------------------------------------------------------------------ */

const AGENT_ROLE = {
  researcher: "Research", writer: "Draft", checker: "Review",
  logger: "Log", notifier: "Notify",
};
const ROSTER_FILL = { Idle: 0, Called: 25, Working: 60, Done: 100, Failed: 100 };

function renderRoster() {
  // The rows are rebuilt on every event; keep keyboard focus on the same row.
  const focused = document.activeElement;
  const rowEl = focused && focused.closest ? focused.closest("#roster-rows .row[data-agent]") : null;
  const focusKey = rowEl ? { step: rowEl.dataset.step, agent: rowEl.dataset.agent } : null;
  const rows = window.SolO.roster(state.records);
  const { completed, total } = window.SolO.progress(state.records);
  rosterCount.textContent = total ? `${completed} / ${total} steps` : "";
  if (!rows.length) {
    rosterRows.innerHTML = '<p class="empty">' + (state.records.length
      ? "Waiting for the plan…"
      : "No run yet — planned agents appear here.") + "</p>";
    return;
  }
  rosterRows.innerHTML = rows.map((row) => {
    const status = row.status;
    const role = AGENT_ROLE[row.agent] || row.task || "agent";
    const state_ = status.toLowerCase();
    return `<div class="row ${state_}" style="--dot:${row.accent}" role="button" tabindex="0"` +
      ` data-step="${row.step}" data-agent="${escapeHtml(row.agent)}"` +
      ` aria-label="Open ${escapeHtml(row.agent)} details, ${status}">` +
      `<span class="dot"></span><div>` +
      `<div class="nm"><span class="agent">${escapeHtml(row.agent)}</span>` +
      `<span class="chip ${state_}">${status}</span></div>` +
      `<div class="role">${escapeHtml(role.slice(0, 46))}</div>` +
      `<div class="bar"><i style="width:${ROSTER_FILL[status]}%"></i></div>` +
      `</div></div>`;
  }).join("");
  if (focusKey) {
    const same = rosterRows.querySelector(
      `.row[data-step="${focusKey.step}"][data-agent="${CSS.escape(focusKey.agent)}"]`);
    if (same) same.focus();
  }
}

/* ------------------------------------------------------------------ */
/* Planets                                                             */
/* ------------------------------------------------------------------ */

function orbitRadius(index) {
  const width = stageRect.width || W;
  const height = stageRect.height || H;
  const span = Math.min(width, height * 1.7);
  return Math.max(70, span * 0.14 + index * span * 0.045);
}

function planetFor(step, agent, placeholder) {
  const key = `${step}:${agent}`;
  let planet = state.planets.get(key);
  if (planet) return planet;
  const style = styleFor(agent);
  const planIndex = state.plans.findIndex(
    (plan) => plan.step === step && plan.agent === agent
  );
  const orbitIndex = planIndex >= 0 ? planIndex : state.plans.length + state.extraPlanets;
  if (planIndex < 0) state.extraPlanets += 1;
  planet = {
    key,
    step,
    agent,
    orbitIndex,
    color: style.color,
    size: style.size,
    ring: style.ring,
    moon: style.moon,
    tex: textureTile(style),
    angle: Math.random() * TAU,
    speed: 0.09 + (step % 5) * 0.012,
    appear: placeholder ? 0.28 : 0,
    target: placeholder ? 0.28 : 1,
    placeholder: Boolean(placeholder),
    skipped: false,
    working: false,
    done: false,
    failed: false,
    summary: "",
    attempts: 1,
    calls: 1,
    error: "",
    calledAt: 0,
    doneAt: 0,
    trailAt: 0,
    sx: 0,
    sy: 0,
  };
  state.planets.set(key, planet);
  return planet;
}

function resetScene() {
  state.plans = [];
  state.planets.clear();
  state.alignPhase = null;
  state.alignAmount = 0;
  state.pulseAt = 0;
  // state.pending is deliberately untouched: the gate closes only on approval_decided.
  state.outputs = null;
  state.outputsRun = null;
  state.detailData = null;
  state.detailRun = null;
  state.lastSeconds = null;
  state.lastStopReason = "";
  state.lastFailure = null;
  state.lastResultStatus = null;
  state.extraPlanets = 0;
  state.log = [];
  state.records = [];
  panel.classList.add("hidden");
  outputBox.classList.add("hidden");
  setModal(false);
  planCount.classList.add("hidden");
  renderLog();
  renderRoster();
  syncDecisionGate();
  setSun("idle", "");
}

/* The gate's decisions are live controls only for a live run. */
let deciding = false;
function syncDecisionGate() {
  const replay = state.mode === "replay";
  approveBtn.disabled = replay || deciding;
  rejectBtn.disabled = replay || deciding;
  approvalBox.classList.toggle("replay", replay);
  if (replay) approvalBox.removeAttribute("aria-modal");
  else approvalBox.setAttribute("aria-modal", "true");
  approvalLabel.textContent = replay
    ? "Stored pending action · replay is read-only · nothing will be sent"
    : deciding
      ? "Sending your decision…"
      : "Approval required · nothing has been sent";
}

/* ------------------------------------------------------------------ */
/* Event application (live and replay share this)                      */
/* ------------------------------------------------------------------ */

function applyEvent(record) {
  const name = record.event;
  const data = record.data || {};
  if (record.run_id) state.runId = record.run_id;
  const plannerEvent = isPlannerEvent(data);

  switch (name) {
    case "run_started": {
      if (state.follow !== record.run_id) {
        state.follow = record.run_id;
        resetScene();
        state.runId = record.run_id;
      }
      setSun("orchestrating", "run started");
      break;
    }
    case "plan_ready": {
      const agents = data.agents || (data.steps || []).map((item) => item.agent);
      state.plans = agents.map((agent, index) => ({ step: index + 1, agent }));
      state.planets.clear();
      state.extraPlanets = 0;
      state.plans.forEach((plan) => planetFor(plan.step, plan.agent, true));
      setSun("planning", `${agents.length} planets planned`);
      showPlanCount(agents.length);
      break;
    }
    case "agent_called": {
      if (plannerEvent) break;
      const planet = planetFor(data.step, data.agent, false);
      planet.placeholder = false;
      planet.calledAt = performance.now();
      planet.trailAt = planet.calledAt;
      planet.target = 1;
      setSun("orchestrating", `${data.agent} called`);
      break;
    }
    case "agent_working": {
      if (plannerEvent) {
        setSun("planning", "planner working");
        break;
      }
      const planet = planetFor(data.step, data.agent, false);
      planet.working = true;
      planet.calls = Math.max(planet.calls, data.call || 1);
      setSun("orchestrating", `${data.agent} working${planet.calls > 1 ? " · call " + planet.calls : ""}`);
      break;
    }
    case "agent_done": {
      if (plannerEvent) break;
      const planet = planetFor(data.step, data.agent, false);
      planet.working = false;
      planet.done = true;
      planet.doneAt = performance.now();
      planet.summary = data.summary || "";
      if (data.attempts) planet.attempts = data.attempts;
      break;
    }
    case "agent_failed": {
      if (plannerEvent) {
        setSun("failed", data.error_type || "failed");
        break;
      }
      const planet = planetFor(data.step, data.agent, false);
      planet.working = false;
      planet.failed = true;
      planet.error = `${data.error_type || data.error || "error"}: ${data.message || ""}`.trim();
      state.slowUntil = performance.now() + 2500;
      setSun("failed", data.error_type || "failed");
      break;
    }
    case "awaiting_approval": {
      state.pending = { id: data.pending_id, preview: data.preview || "" };
      approvalPreview.textContent = data.preview || `Pending action #${data.pending_id}`;
      approvalBox.classList.remove("hidden");
      // Never yank focus into a replay's read-only gate.
      if (state.mode !== "replay") approveBtn.focus();
      setSun("awaiting", `pending #${data.pending_id}`);
      break;
    }
    case "approval_decided": {
      state.pending = null;
      approvalBox.classList.add("hidden");
      refreshRuns();
      const runStatus = data.run_status || (data.decision === "approved" ? "complete" : "rejected");
      if (data.decision === "approved" && runStatus === "complete") {
        setSun("complete", "approved");
        startAlignment();
      } else if (data.decision === "approved") {
        setSun(runStatus, "approved");
      } else {
        setSun("rejected", data.decision);
      }
      showResult(data.decision === "approved" ? runStatus : "rejected");
      break;
    }
    case "all_done": {
      state.lastRunStatus = data.status;
      state.lastSeconds = data.seconds != null ? data.seconds : null;
      if (data.status === "complete") {
        setSun("complete", `finished in ${data.seconds}s`);
        startAlignment();
      } else {
        markSkipped();
        setSun(data.status || "complete", data.status || "");
      }
      showResult(data.status);
      refreshRuns();
      break;
    }
    case "tool_requested": {
      setSun("orchestrating", `${data.agent} → ${data.tool}`);
      break;
    }
    case "tool_done": {
      const trimmed = data.truncated ? " · trimmed" : "";
      setSun("orchestrating", `${data.tool} ${data.ok ? "done" : "failed"}${trimmed}`);
      break;
    }
    case "stopped": {
      state.lastStopReason = data.reason || "";
      markSkipped();
      break;
    }
    case "run_failed": {
      state.lastFailure = data;
      const failed = [...state.planets.values()].find((planet) => planet.agent === data.failed_at);
      if (failed) {
        failed.failed = true;
        failed.working = false;
        failed.error = `${data.error_type}: ${data.message || ""}`;
      }
      state.slowUntil = performance.now() + 2500;
      setSun("failed", data.error_type || "failed");
      showResult("failed", data);
      refreshRuns();
      break;
    }
    default:
      break;
  }
  pushLog(name, data, recordTime(record) || undefined);
  state.records.push(record);
  renderRoster();
  syncDecisionGate();
}

function markSkipped() {
  for (const planet of state.planets.values()) {
    if (planet.placeholder && !planet.done && !planet.failed && !planet.working) {
      planet.skipped = true;
      planet.target = 0.06;
    }
  }
}

function startAlignment() {
  if (reduceMotion) {
    // Snap into line, no travel and no pulse ring.
    state.alignPhase = null;
    state.alignStart = 0;
    state.alignAmount = 1;
    state.pulseAt = 0;
    return;
  }
  state.alignPhase = "in";
  state.alignStart = performance.now();
  state.alignAmount = 0;
  state.pulseAt = state.alignStart;
}

/* ------------------------------------------------------------------ */
/* Live SSE                                                            */
/* ------------------------------------------------------------------ */

const BOOT_AT = Date.now();

function handleLive(record) {
  if (state.mode !== "live") return;
  // Skip the historical backlog a fresh tab receives; keep anything from this page's lifetime.
  const stamp = Date.parse(record.ts);
  if (state.follow === null && Number.isFinite(stamp) && stamp < BOOT_AT - 2500) return;
  if (!state.follow) {
    state.follow = record.run_id;
    state.runId = record.run_id;
  }
  if (record.run_id !== state.follow) return;
  applyEvent(record);
}

function connectStream() {
  const source = new EventSource("/stream");
  source.onmessage = (message) => {
    try {
      handleLive(JSON.parse(message.data));
    } catch (error) {
      console.warn("bad event", error);
    }
  };
  source.onerror = () => {
    /* EventSource reconnects and replays via Last-Event-ID automatically. */
  };
}

/* ------------------------------------------------------------------ */
/* Run / replay / approvals                                            */
/* ------------------------------------------------------------------ */

async function startRun() {
  const task = taskInput.value.trim();
  if (!task) {
    taskInput.focus();
    return;
  }
  clearReplayTimers();
  state.mode = "live";
  state.follow = null;
  state.runId = null;
  resetScene();
  setSun("orchestrating", "queued");

  try {
    const response = await fetch("/orchestrate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task }),
    });
    const body = await response.json();
    if (!response.ok) throw new Error(body.detail || body.error || "run rejected");
    state.follow = body.run_id;
    state.runId = body.run_id;
    pushLog("run_queued", { task: body.run_id });
  } catch (error) {
    setSun("failed", String(error.message || error));
    pushLog("error", { message: String(error.message || error) });
  }
}

/* Replay playback. One chained timer instead of a burst: pausing stops the
   single pending event and resuming re-arms it with its remaining delay, so
   no record is skipped or applied twice. */
const REPLAY_GAP_CAP = 1500;

const replayPlayer = {
  records: [],
  index: 0,          // index of the next record to apply
  timer: 0,
  paused: false,
  dueAt: 0,
  remaining: 0,
  rate: 1,
};

function clearReplayTimers() {
  if (replayPlayer.timer) clearTimeout(replayPlayer.timer);
  replayPlayer.timer = 0;
  replayPlayer.records = [];
  replayPlayer.index = 0;
  replayPlayer.paused = false;
  replayPlayer.remaining = 0;
  replayPlayer.rate = 1;
  setReplayControls(false);
}

function setReplayControls(visible) {
  replayControls.classList.toggle("hidden", !visible);
  syncReplayControls();
}

function syncReplayControls() {
  replayPause.textContent = replayPlayer.paused ? "Resume" : "Pause";
  replayPause.setAttribute("aria-pressed", String(replayPlayer.paused));
  replaySpeed.textContent = `${replayPlayer.rate}x`;
  replaySpeed.setAttribute("aria-pressed", String(replayPlayer.rate === 2));
}

function scheduleReplayStep(delay) {
  replayPlayer.remaining = delay;
  replayPlayer.dueAt = performance.now() + delay;
  replayPlayer.timer = setTimeout(runReplayStep, delay);
}

function runReplayStep() {
  replayPlayer.timer = 0;
  replayPlayer.remaining = 0;
  const record = replayPlayer.records[replayPlayer.index];
  if (!record) return;
  replayPlayer.index += 1;
  applyEvent(record);
  if (replayPlayer.index >= replayPlayer.records.length) {
    setReplayControls(false);
    return;
  }
  scheduleReplayStep(replayGap(replayPlayer.index));
}

function replayGap(index) {
  const current = replayPlayer.records[index];
  const previous = replayPlayer.records[index - 1];
  const delta = Date.parse(current.ts) - Date.parse(previous.ts);
  const gap = Number.isFinite(delta) ? clamp(delta, 0, REPLAY_GAP_CAP) : 0;
  return gap / replayPlayer.rate;   // 2x halves the 1500ms cap and every gap
}

function pauseReplay() {
  if (replayPlayer.paused) return;
  replayPlayer.paused = true;
  replayPlayer.remaining = replayPlayer.timer
    ? Math.max(0, replayPlayer.dueAt - performance.now())
    : 0;
  if (replayPlayer.timer) clearTimeout(replayPlayer.timer);
  replayPlayer.timer = 0;
  syncReplayControls();
}

function resumeReplay() {
  if (!replayPlayer.paused) return;
  replayPlayer.paused = false;
  syncReplayControls();
  scheduleReplayStep(replayPlayer.remaining);
}

function toggleReplayRate() {
  const next = replayPlayer.rate === 1 ? 2 : 1;
  // Keep the wall-clock position of the pending gap, then re-arm it at the new speed.
  const left = replayPlayer.timer
    ? Math.max(0, replayPlayer.dueAt - performance.now())
    : replayPlayer.remaining;
  const scaled = (left * replayPlayer.rate) / next;
  if (replayPlayer.timer) clearTimeout(replayPlayer.timer);
  replayPlayer.timer = 0;
  replayPlayer.rate = next;
  if (replayPlayer.paused) replayPlayer.remaining = scaled;
  else if (replayPlayer.records.length) scheduleReplayStep(scaled);
  syncReplayControls();
}

let replayToken = 0;

async function replayRun(runId) {
  if (!runId) return;
  const token = ++replayToken;
  const stale = () => token !== replayToken || state.mode !== "replay";
  clearReplayTimers();
  state.mode = "replay";
  state.follow = runId;
  state.runId = runId;
  resetScene();
  pillText.textContent = "REPLAY · LOADING";
  pill.className = "pill working";

  try {
    const response = await fetch(`/runs/${runId}/events`);
    if (stale()) return;
    if (!response.ok) throw new Error("could not load events");
    const records = await response.json();
    if (stale()) return;
    if (!records.length) {
      pillText.textContent = "REPLAY · EMPTY";
      return;
    }
    replayPlayer.records = records;
    setReplayControls(true);
    scheduleReplayStep(0);
  } catch (error) {
    if (stale()) return;
    pillText.textContent = "REPLAY · ERROR";
    pill.className = "pill failed";
    pushLog("error", { message: String(error.message || error) });
  }
}

async function decide(kind) {
  if (!state.pending || state.mode === "replay" || deciding) return;
  const id = state.pending.id;
  deciding = true;
  syncDecisionGate();
  try {
    const response = await fetch(`/pending/${id}/${kind}`, { method: "POST" });
    const body = await response.json();
    if (!response.ok) throw new Error(body.detail || body.error || "decision failed");
    pushLog(`approval_${kind}`, { pending_id: id, status: body.status });
  } catch (error) {
    pushLog("error", { message: String(error.message || error) });
  } finally {
    deciding = false;
    syncDecisionGate();
  }
}

async function refreshRuns() {
  try {
    const response = await fetch("/runs?limit=25");
    const rows = await response.json();
    const current = replaySelect.value;
    replaySelect.innerHTML = '<option value="">Replay a run…</option>' + rows.map((row) => {
      const when = (row.created_at || "").replace("T", " ").slice(0, 16);
      const label = `${when} · ${row.status} · ${(row.task || "").slice(0, 42)}`;
      return `<option value="${escapeHtml(row.id)}">${escapeHtml(label)}</option>`;
    }).join("");
    if (current) replaySelect.value = current;
  } catch (error) {
    /* the dropdown is best-effort */
  }
}

async function loadRunDetail(force) {
  if (!state.runId) throw new Error("No run id yet.");
  const runId = state.runId;
  if (!force && state.detailData && state.detailRun === runId) {
    return state.detailData;
  }
  const response = await fetch(`/runs/${runId}`);
  if (!response.ok) throw new Error("run has not been saved yet");
  const detail = await response.json();
  // Another run (or a replay) took over while this was in flight: don't cache it.
  if (state.runId !== runId) return null;
  state.detailData = detail;
  state.detailRun = runId;
  state.outputs = (detail.run && detail.run.outputs) || [];
  state.outputsRun = runId;
  return detail;
}

function lastWriterDraft(outputs) {
  for (let i = outputs.length - 1; i >= 0; i -= 1) {
    const item = outputs[i] || {};
    const out = item.output || {};
    if (item.agent === "writer" && out.draft) return String(out.draft);
  }
  return "";
}

function lastClarification(outputs) {
  for (let i = outputs.length - 1; i >= 0; i -= 1) {
    const out = (outputs[i] || {}).output || {};
    if (out.clarification_needed) return String(out.clarification_needed);
  }
  return "";
}

function lastCheckerIssues(outputs) {
  for (let i = outputs.length - 1; i >= 0; i -= 1) {
    const item = outputs[i] || {};
    if (item.agent !== "checker") continue;
    const issues = (item.output || {}).issues;
    if (Array.isArray(issues)) return issues;
  }
  return [];
}

let outputOpener = null;

function closeOutput() {
  outputBox.classList.add("hidden");
  setModal(false);
  const opener = outputOpener;
  outputOpener = null;
  if (opener && opener.isConnected) opener.focus();
}

async function showResult(status, data) {
  state.lastResultStatus = status;
  closeDrawer();
  if (!outputBox.contains(document.activeElement)) outputOpener = document.activeElement;
  outputBox.classList.remove("hidden");
  setModal(true);
  // A dialog only announces itself when it takes focus.
  outputBox.focus();
  outputBody.textContent = "loading…";
  outputMeta.textContent = runStateLabel(status).toUpperCase();

  let run = null;
  let outputs = [];
  try {
    const detail = await loadRunDetail(true);
    run = (detail && detail.run) || null;
    outputs = (run && run.outputs) || [];
  } catch (error) {
    /* fall back to what the event stream told us */
  }

  const seconds = state.lastSeconds != null ? state.lastSeconds : run ? run.duration_seconds : null;
  const bits = [runStateLabel(status).toUpperCase()];
  if (seconds != null) bits.push(`${seconds}s`);
  if (run && run.verdict) bits.push(`checker: ${run.verdict}`);
  if (state.runId) bits.push(state.runId.slice(0, 8));
  outputMeta.textContent = bits.join(" · ");

  if (status === "complete") {
    // The plan's agent count, not the done planets: checker revisions add planets.
    const count = state.plans.length;
    const elapsed = seconds != null ? ` · ${Math.round(seconds * 10) / 10}s` : "";
    outputTitle.textContent = `${count ? `All ${count} agents completed` : "Run completed"}${elapsed}`;
  } else {
    // Every other outcome keeps the neutral header: never claim success.
    outputTitle.textContent = "Result";
  }

  let text = "";
  if (status === "complete") {
    text = (run && run.final_draft) || lastWriterDraft(outputs) || "Run completed, but no draft was stored.";
  } else if (status === "partial") {
    text = (run && run.final_draft) || lastWriterDraft(outputs) || "(no draft)";
    const issues = lastCheckerIssues(outputs);
    if (issues.length) {
      text += "\n\nChecker issues:\n" + issues.map((issue) => {
        const where = issue.location ? ` (${issue.location})` : "";
        const fix = issue.suggestion ? `\n   → ${issue.suggestion}` : "";
        return `• ${issue.problem}${where}${fix}`;
      }).join("\n");
    }
  } else if (status === "needs_clarification") {
    text = lastClarification(outputs) || state.lastStopReason
      || (data && data.message) || "The agent needs more information.";
    const draft = lastWriterDraft(outputs);
    if (draft) text += "\n\nDraft so far:\n" + draft;
  } else if (status === "rejected") {
    text = "Rejected. Nothing was sent.";
    const draft = (run && run.final_draft) || lastWriterDraft(outputs);
    if (draft) text += "\n\nDraft (not sent):\n" + draft;
  } else if (status === "failed") {
    const failure = state.lastFailure || {};
    text = [failure.error_type, failure.failed_at ? `at ${failure.failed_at}` : "", failure.message]
      .filter(Boolean).join(" · ") || "Run failed.";
  } else {
    text = `Status: ${runStateLabel(status)}`;
  }

  outputBody.textContent = text;
  outputBox.scrollTop = 0;
}

/* ------------------------------------------------------------------ */
/* Agent drawer (opened by a planet click or a roster row activation)  */
/* ------------------------------------------------------------------ */

let drawerOpener = null;
let drawerOpenerKey = null;
let drawerToken = 0;

const STATUS_TONE = {
  Idle: "#a39a89", Called: "#8fb3d9", Working: "#e9b45c", Done: "#8cc79d", Failed: "#e28372",
};

function planetStatus(planet) {
  if (planet.failed) return "Failed";
  if (planet.done) return "Done";
  if (planet.working) return "Working";
  return planet.placeholder ? "Idle" : "Called";
}

/* Role, task and duration come from the same records the roster uses. */
function drawerFacts(step, agent) {
  let task = "";
  let duration = "";
  let calledAt = 0;
  let endedAt = 0;
  (state.records || []).forEach((record) => {
    const data = record.data || {};
    const matches = data.agent === agent && (data.step == null || data.step === step);
    if (record.event === "plan_ready") {
      const steps = data.steps || [];
      const item = steps[step - 1] && steps[step - 1].agent === agent
        ? steps[step - 1]
        : steps.find((entry) => entry.agent === agent);
      if (item && item.task) task = item.task;
    }
    if (record.event === "agent_called" && matches) calledAt = Date.parse(record.ts);
    if (record.event === "agent_done" && matches) {
      endedAt = Date.parse(record.ts);
      if (data.duration_seconds != null) duration = `${data.duration_seconds}s`;
    }
    if (record.event === "agent_failed" && matches) endedAt = Date.parse(record.ts);
  });
  if (!duration && calledAt && endedAt && endedAt >= calledAt) {
    duration = `${((endedAt - calledAt) / 1000).toFixed(1)}s`;
  }
  const planet = state.planets.get(`${step}:${agent}`);
  const status = planet ? planetStatus(planet) : duration ? "Done" : "Called";
  return { task, duration, status };
}

async function loadDrawerOutput(step, agent, token) {
  const planet = state.planets.get(`${step}:${agent}`);
  if (!state.runId) {
    panelOutput.textContent = "No run id yet.";
    return;
  }
  try {
    const detail = await loadRunDetail(!state.outputs || !state.outputs.length);
    if (!detail || token !== drawerToken) return;
    const outputs = (detail.run && detail.run.outputs) || [];
    const found =
      outputs.find((item) => item.step === step && item.agent === agent) ||
      outputs.find((item) => item.agent === agent);
    panelOutput.textContent = JSON.stringify(
      found ? (found.output !== undefined ? found.output : found) : {
        agent,
        step,
        status: planet && planet.failed ? "failed" : planet && planet.done ? "complete" : "working",
        summary: planet && planet.summary,
        error: (planet && planet.error) || undefined,
      },
      null,
      2
    );
  } catch (error) {
    if (token !== drawerToken) return;
    panelOutput.textContent = String(error.message || error);
  }
}

function openDrawer(step, agent, opener) {
  drawerOpener = opener || null;
  drawerOpenerKey = opener && opener.classList && opener.classList.contains("row") ? { step, agent } : null;
  const token = ++drawerToken;
  const facts = drawerFacts(step, agent);
  const status = facts.status;
  tooltip.classList.add("hidden");
  panelTitle.textContent = `${agent} · step ${step}`;
  panelStatus.textContent = status;
  panelStatus.className = `chip ${status.toLowerCase()}`;
  panelRole.textContent = AGENT_ROLE[agent] || facts.task || "agent";
  panelTask.textContent = facts.task || "—";
  panelDuration.textContent = facts.duration ||
    (status === "Working" || status === "Called" ? "in progress" : "—");
  panelOutput.textContent = "loading…";
  panel.classList.remove("hidden");
  outputBox.classList.add("hidden");
  setModal(true);
  panelClose.focus();
  loadDrawerOutput(step, agent, token);
}

function closeDrawer() {
  if (panel.classList.contains("hidden")) return;
  drawerToken += 1;
  panel.classList.add("hidden");
  setModal(false);
  const key = drawerOpenerKey;
  let opener = drawerOpener;
  drawerOpener = null;
  drawerOpenerKey = null;
  // Roster rows are re-rendered on every event, so fall back to the same row.
  if (key && (!opener || !opener.isConnected)) {
    opener = rosterRows.querySelector(`.row[data-step="${key.step}"][data-agent="${CSS.escape(key.agent)}"]`);
  }
  if (opener && opener.isConnected) opener.focus();
}

/* ------------------------------------------------------------------ */
/* Rendering                                                           */
/* ------------------------------------------------------------------ */

function drawBackground(now) {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = nebulaA;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = nebulaB;
  ctx.fillRect(0, 0, W, H);

  if (reduceMotion) {
    camX = 0;
    camY = 0;
  } else {
    camX += ((pointer.x / W - 0.5) * 2 - camX) * 0.05;
    camY += ((pointer.y / H - 0.5) * 2 - camY) * 0.05;
  }

  ctx.fillStyle = "#e7dcc5";
  for (let i = 0; i < stars.length; i += 1) {
    const star = stars[i];
    ctx.globalAlpha = reduceMotion
      ? 0.35 + 0.55 * star.depth
      : (0.45 + 0.55 * (0.5 + 0.5 * Math.sin(now * 0.001 * star.speed + star.phase))) * star.depth;
    ctx.beginPath();
    ctx.arc(star.x + camX * CAM_LIMIT * star.depth, star.y + camY * CAM_LIMIT * star.depth, star.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Grain blitted in device pixels so it stays crisp at any dpr.
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 0.06;
  ctx.fillStyle = noisePattern;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.restore();
}

function drawOrbitRings() {
  state.plans.forEach((plan, index) => {
    const radius = orbitRadius(index);
    ctx.beginPath();
    ctx.ellipse(CX, CY, radius, radius * 0.55, 0, 0, TAU);
    ctx.strokeStyle = "rgba(236, 231, 220, 0.1)";
    ctx.lineWidth = 1;
    ctx.setLineDash([2, 7]);
    ctx.stroke();
    ctx.setLineDash([]);
  });
}

// One cached, deterministic photosphere: low-frequency bright and dark cells.
function sunPhotosphere() {
  return cachedTile("sun", (g) => {
    const rand = textureRandom(7);
    for (let i = 0; i < 34; i += 1) {
      const x = rand() * TEXTURE_TILE;
      const y = rand() * TEXTURE_TILE;
      const r = TEXTURE_TILE * (0.06 + rand() * 0.11);
      const bright = rand() > 0.45;
      const cell = g.createRadialGradient(x, y, 0, x, y, r);
      cell.addColorStop(0, bright ? "rgba(255, 246, 205, 0.5)" : "rgba(150, 48, 0, 0.4)");
      cell.addColorStop(1, bright ? "rgba(255, 246, 205, 0)" : "rgba(150, 48, 0, 0)");
      g.fillStyle = cell;
      g.beginPath();
      g.arc(x, y, r, 0, TAU);
      g.fill();
    }
  });
}

function drawSun(now) {
  // Freezing t freezes the corona pulse, the ray rotation and the ring alphas.
  const t = reduceMotion ? 0 : now;
  const pulse = 0.5 + 0.5 * Math.sin(t * 0.0011);
  const core = 32 + pulse * 3;

  const corona = ctx.createRadialGradient(CX, CY, core * 0.4, CX, CY, core * 5.2);
  corona.addColorStop(0, `rgba(255, 224, 138, ${0.55 + pulse * 0.12})`);
  corona.addColorStop(0.22, "rgba(255, 178, 64, 0.26)");
  corona.addColorStop(0.55, "rgba(255, 120, 32, 0.10)");
  corona.addColorStop(1, "rgba(255, 90, 0, 0)");
  ctx.fillStyle = corona;
  ctx.beginPath();
  ctx.arc(CX, CY, core * 5.2, 0, TAU);
  ctx.fill();

  const pulseAge = state.pulseAt ? now - state.pulseAt : Infinity;
  if (pulseAge >= 0 && pulseAge < 1200 && !reduceMotion) {
    const t = pulseAge / 1200;
    ctx.save();
    ctx.strokeStyle = `rgba(255, 214, 120, ${0.6 * (1 - t)})`;
    ctx.lineWidth = 4 * (1 - t) + 0.8;
    ctx.beginPath();
    ctx.arc(CX, CY, core * 1.4 + easeOut(t) * Math.min(W, H) * 0.34, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  ctx.save();
  ctx.translate(CX, CY);
  ctx.rotate(t * 0.00004);
  for (let i = 0; i < 14; i += 1) {
    const angle = (i / 14) * TAU;
    const length = core * (2.4 + 0.6 * Math.sin(t * 0.0007 + i));
    ctx.strokeStyle = `rgba(255, 208, 120, ${0.05 + 0.04 * pulse})`;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(Math.cos(angle) * core * 1.35, Math.sin(angle) * core * 1.35);
    ctx.lineTo(Math.cos(angle) * length, Math.sin(angle) * length);
    ctx.stroke();
  }
  ctx.restore();

  const body = ctx.createRadialGradient(CX - core * 0.3, CY - core * 0.32, core * 0.06, CX, CY, core);
  body.addColorStop(0, "#fffdf0");
  body.addColorStop(0.26, "#ffe27a");
  body.addColorStop(0.62, "#ff9f2e");
  body.addColorStop(1, "#c2410a");
  ctx.save();
  ctx.shadowColor = "rgba(255, 176, 60, 0.85)";
  ctx.shadowBlur = 42 + pulse * 22;
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.arc(CX, CY, core, 0, TAU);
  ctx.fill();
  ctx.restore();

  // Granulation turns with the rays' clock; drawn once at twice the core
  // diameter so no tile edge can land inside the clipped disc.
  ctx.save();
  ctx.beginPath();
  ctx.arc(CX, CY, core, 0, TAU);
  ctx.clip();
  ctx.save();
  ctx.translate(CX, CY);
  ctx.rotate(t * 0.00004);
  const side = core * 4;
  ctx.drawImage(sunPhotosphere(), -side / 2, -side / 2, side, side);
  ctx.restore();
  // The tile's bright cells would re-light the limb, so the body shading is
  // laid back over it at partial alpha: the rim darkens, the cells stay.
  ctx.globalAlpha = 0.7;
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.arc(CX, CY, core, 0, TAU);
  ctx.fill();
  ctx.restore();

  if (state.pending) {
    ctx.save();
    ctx.strokeStyle = `rgba(255, 208, 96, ${0.35 + 0.4 * pulse})`;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.arc(CX, CY, core * 1.9 + pulse * 7, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  ctx.textAlign = "center";
  ctx.fillStyle = "rgba(255, 245, 214, 0.92)";
  ctx.font = "700 15px 'Space Grotesk', system-ui, sans-serif";
  ctx.fillText("SUN", CX, CY + core + 36);
  ctx.fillStyle = "rgba(163, 154, 137, 0.9)";
  ctx.font = "500 11.5px 'JetBrains Mono', ui-monospace, monospace";
  const statusText = state.pending ? "waiting for approval" : runStateLabel(state.sun);
  ctx.fillText(statusText.slice(0, 58), CX, CY + core + 52);
  // The detail gets its own line: a decision never shares the run state's line.
  const detailText = runDetailText(statusText, state.detail);
  if (detailText) {
    ctx.fillStyle = "rgba(163, 154, 137, 0.72)";
    ctx.fillText(detailText.slice(0, 58), CX, CY + core + 66);
  }
  ctx.textAlign = "left";
}

function drawBeam(planet, x, y, now) {
  if (!planet.working) return;
  const pulse = 0.5 + 0.5 * Math.sin((reduceMotion ? 0 : now) * 0.004 + planet.step);
  const gradient = ctx.createLinearGradient(CX, CY, x, y);
  gradient.addColorStop(0, `rgba(255, 216, 120, ${0.55 + 0.2 * pulse})`);
  gradient.addColorStop(1, `${planet.color}00`);
  ctx.save();
  ctx.strokeStyle = gradient;
  ctx.lineWidth = 1.4 + pulse * 0.8;
  ctx.shadowColor = planet.color;
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.moveTo(CX, CY);
  ctx.lineTo(x, y);
  ctx.stroke();
  ctx.restore();
}

function drawTrail(planet, x, y, now) {
  if (reduceMotion) return;
  const age = now - planet.trailAt;
  if (!planet.trailAt || age > 850) return;
  const alpha = (1 - age / 850) * 0.55;
  const gradient = ctx.createLinearGradient(CX, CY, x, y);
  gradient.addColorStop(0, `rgba(255, 226, 150, ${alpha * 0.2})`);
  gradient.addColorStop(1, `rgba(255, 226, 150, ${alpha})`);
  ctx.save();
  ctx.strokeStyle = gradient;
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(CX, CY);
  ctx.lineTo(x, y);
  ctx.stroke();
  ctx.restore();
}

/* Three concentric strokes make a band; each half is stroked around the disc so
   the near side of the ring passes in front of the planet. Alpha falls as the
   stroke widens, keeping the band soft at its outer edge. */
const RING_BAND = [
  [0.88, 0.5, 1.2],
  [1, 0.34, 1.6],
  [1.12, 0.2, 1.9],
];
function strokeRingBand(x, y, size, styles, phase, start, end) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(phase);
  for (let i = 0; i < RING_BAND.length; i += 1) {
    const [scale, , width] = RING_BAND[i];
    ctx.strokeStyle = styles[i];
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.ellipse(0, 0, size * 1.9 * scale, size * 0.62 * scale, 0, start, end);
    ctx.stroke();
  }
  ctx.restore();
}

function drawPlanet(planet, x, y, now) {
  const appear = easeOut(clamp(planet.appear, 0, 1));
  if (appear <= 0.01) return;
  const size = planet.size * (0.55 + 0.45 * appear);
  // One frozen clock drives every decorative pulse, ring wobble and moon orbit.
  const t = reduceMotion ? 0 : now;
  const pulse = 0.5 + 0.5 * Math.sin(t * 0.005 + planet.step * 1.7);
  const flicker = planet.failed && !reduceMotion ? 0.45 + 0.55 * Math.abs(Math.sin(now * 0.02)) : 1;
  const color = planet.failed ? "#e28372" : planet.color;
  const ringPhase = -0.42 + Math.sin(t * 0.0004 + planet.step) * 0.05;
  const glow = planet.working ? 26 + pulse * 18 : planet.done ? 14 : 9;

  // Gradients live in local space, so they are built once per size/colour/mode
  // and re-used under a translated transform instead of per frame.
  const mode = planet.working ? "w" : "n";
  if (planet.gradSize !== size || planet.gradColor !== color || planet.gradMode !== mode) {
    planet.gradSize = size;
    planet.gradColor = color;
    planet.gradMode = mode;
    const halo = ctx.createRadialGradient(0, 0, size * 0.3, 0, 0, size * 3.4);
    halo.addColorStop(0, hexAlpha(color, planet.working ? 0.42 : 0.22));
    halo.addColorStop(1, hexAlpha(color, 0));
    planet.halo = halo;
    const shading = ctx.createRadialGradient(
      -size * 0.35, -size * 0.4, size * 0.1, 0, 0, size
    );
    shading.addColorStop(0, lighten(color, 0.45));
    shading.addColorStop(0.55, color);
    shading.addColorStop(1, darken(color, 0.45));
    planet.shading = shading;
    // Stroke colour strings depend only on the resolved colour, so they are
    // built here with the gradients and re-used by both ring halves.
    planet.ringStyles = RING_BAND.map(([, alpha]) => hexAlpha(color, alpha));
  }

  ctx.save();
  ctx.globalAlpha = appear * flicker;

  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = planet.halo;
  ctx.beginPath();
  ctx.arc(0, 0, size * 3.4, 0, TAU);
  ctx.fill();
  ctx.restore();

  if (planet.ring) {
    // Back half only; the front half is stroked after the disc.
    strokeRingBand(x, y, size, planet.ringStyles, ringPhase, Math.PI, TAU);
  }

  ctx.save();
  ctx.translate(x, y);
  ctx.shadowColor = color;
  ctx.shadowBlur = glow;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(0, 0, size, 0, TAU);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.clip();
  ctx.save();
  // The texture spins with the planet's orbital angle, never a second clock.
  ctx.rotate(reduceMotion ? 0 : planet.angle);
  const stamp = size * TEXTURE_STAMP * 2;
  ctx.drawImage(planet.tex, -stamp / 2, -stamp / 2, stamp, stamp);
  ctx.restore();
  // A failed planet is fully red: multiply the stamped texture down inside the
  // disc clip so the white cap motif cannot survive, while its variation does.
  if (planet.failed) {
    ctx.globalCompositeOperation = "multiply";
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(0, 0, size, 0, TAU);
    ctx.fill();
    ctx.globalCompositeOperation = "source-over";
  }
  // Shading, not paint: the lit gradient must not bury the texture.
  ctx.globalAlpha *= 0.62;
  ctx.fillStyle = planet.shading;
  ctx.beginPath();
  ctx.arc(0, 0, size, 0, TAU);
  ctx.fill();
  ctx.restore();

  // Front half of the ring: drawn over the disc so the near side occludes it.
  if (planet.ring) {
    strokeRingBand(x, y, size, planet.ringStyles, ringPhase, 0, Math.PI);
  }

  if (planet.moon) {
    const moonAngle = planet.angle * 2.6 + t * 0.0006;
    const moonX = x + Math.cos(moonAngle) * size * 2.1;
    const moonY = y + Math.sin(moonAngle) * size * 1.2;
    ctx.fillStyle = "rgba(236, 231, 220, 0.7)";
    ctx.beginPath();
    ctx.arc(moonX, moonY, Math.max(1.2, size * 0.16), 0, TAU);
    ctx.fill();
  }

  if (planet.done && !planet.failed) {
    ctx.strokeStyle = `rgba(140, 199, 157, ${0.55 + 0.35 * pulse})`;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(x, y, size * 1.55, 0, TAU);
    ctx.stroke();
    ctx.strokeStyle = "#a9d9b5";
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(x + size * 1.3, y - size * 1.3);
    ctx.lineTo(x + size * 1.6, y - size * 1.0);
    ctx.lineTo(x + size * 2.1, y - size * 1.75);
    ctx.stroke();
  }

  if (planet.failed) {
    ctx.strokeStyle = "#f0c4b9";
    ctx.lineWidth = 2;
    const offset = size * 0.75;
    ctx.beginPath();
    ctx.moveTo(x - offset, y - offset);
    ctx.lineTo(x + offset, y + offset);
    ctx.moveTo(x + offset, y - offset);
    ctx.lineTo(x - offset, y + offset);
    ctx.stroke();
  }

  if (planet.attempts > 1) {
    const label = `attempt ${planet.attempts}`;
    ctx.font = "600 12px 'Space Grotesk', system-ui, sans-serif";
    const width = ctx.measureText(label).width + 10;
    ctx.fillStyle = "rgba(8, 7, 6, 0.85)";
    ctx.strokeStyle = hexAlpha(color, 0.7);
    ctx.lineWidth = 1;
    roundRect(x - width / 2, y - size - 20, width, 14, 5);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#ece7dc";
    ctx.textAlign = "center";
    ctx.fillText(label, x, y - size - 9.5);
    ctx.textAlign = "left";
  }

  ctx.fillStyle = "rgba(236, 231, 220, 0.86)";
  ctx.font = "600 12px 'Space Grotesk', system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(planet.agent, x, y + size + 15);
  ctx.textAlign = "left";
  ctx.restore();

  planet.sx = x;
  planet.sy = y;
}

function drawAlignmentFlash(now) {
  if (state.alignPhase !== "hold") return;
  const pulse = 0.6 + 0.4 * Math.sin(now * 0.008);
  const gradient = ctx.createLinearGradient(0, CY, W, CY);
  gradient.addColorStop(0, "rgba(255, 205, 90, 0)");
  gradient.addColorStop(0.5, `rgba(255, 225, 140, ${0.5 * pulse})`);
  gradient.addColorStop(1, "rgba(255, 205, 90, 0)");
  ctx.save();
  ctx.strokeStyle = gradient;
  ctx.lineWidth = 3 + pulse * 2;
  ctx.shadowColor = "rgba(255, 210, 110, 0.8)";
  ctx.shadowBlur = 26;
  ctx.beginPath();
  ctx.moveTo(0, CY);
  ctx.lineTo(W, CY);
  ctx.stroke();
  ctx.restore();
}

function roundRect(x, y, width, height, radius) {
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.arcTo(x + width, y, x + width, y + height, radius);
  ctx.arcTo(x + width, y + height, x, y + height, radius);
  ctx.arcTo(x, y + height, x, y, radius);
  ctx.arcTo(x, y, x + width, y, radius);
  ctx.closePath();
}

function hexAlpha(hex, alpha) {
  const value = hex.replace("#", "");
  const r = parseInt(value.slice(0, 2), 16);
  const g = parseInt(value.slice(2, 4), 16);
  const b = parseInt(value.slice(4, 6), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function lighten(hex, amount) {
  return mix(hex, 255, amount);
}

function darken(hex, amount) {
  return mix(hex, 0, amount);
}

function mix(hex, target, amount) {
  const value = hex.replace("#", "");
  const channels = [0, 2, 4].map((offset) => {
    const channel = parseInt(value.slice(offset, offset + 2), 16);
    return Math.round(channel + (target - channel) * amount);
  });
  return `rgb(${channels.join(",")})`;
}

function updateAnimation(now) {
  const dt = Math.min(64, now - lastNow);
  lastNow = now;
  const slowed = now < state.slowUntil;
  const aligning = state.alignPhase !== null;

  for (const planet of state.planets.values()) {
    const speed = planet.speed * (slowed ? 0.25 : 1) * (aligning ? 0 : 1);
    planet.angle += speed * (dt / 1000);
    const rate = 1 - Math.pow(0.001, dt / 1000);
    // State still changes on events; only the entrance ease is decoration.
    planet.appear = reduceMotion ? planet.target : planet.appear + (planet.target - planet.appear) * rate;
  }

  if (state.alignPhase === "in") {
    const t = clamp((now - state.alignStart) / 1200, 0, 1);
    state.alignAmount = easeInOut(t);
    if (t >= 1) {
      state.alignPhase = "hold";
      state.alignStart = now;
    }
  } else if (state.alignPhase === "hold") {
    state.alignAmount = 1;
    if (now - state.alignStart > 3000) {
      state.alignPhase = "out";
      state.alignStart = now;
    }
  } else if (state.alignPhase === "out") {
    const t = clamp((now - state.alignStart) / 1200, 0, 1);
    state.alignAmount = 1 - easeInOut(t);
    if (t >= 1) {
      state.alignPhase = null;
      state.alignAmount = 0;
    }
  }

  const list = [...state.planets.values()];
  const amount = state.alignAmount > 0.001 ? easeInOut(state.alignAmount) : 0;
  if (amount > 0) {
    // Slots are computed once per frame, not once per lookup.
    for (const planet of list) planet.alignX = null;
    const finished = list.filter((planet) => planet.appear > 0.05).sort((a, b) => a.step - b.step);
    const spacing = Math.min(150, ((stageRect.width || W) * 0.38) / Math.max(1, Math.ceil(finished.length / 2)));
    finished.forEach((planet, index) => {
      planet.alignX = CX + (index % 2 === 0 ? 1 : -1) * (Math.floor(index / 2) + 1) * spacing;
      planet.alignY = CY;
    });
  }

  for (const planet of list) {
    const index = planet.orbitIndex != null ? planet.orbitIndex : list.length;
    const radius = orbitRadius(index);
    const bx = CX + Math.cos(planet.angle) * radius;
    const by = CY + Math.sin(planet.angle) * radius * 0.55;
    planet.px = planet.alignX != null ? bx + (planet.alignX - bx) * amount : bx;
    planet.py = planet.alignY != null ? by + (planet.alignY - by) * amount : by;
    planet.depth = by;
  }
  list.sort((a, b) => a.depth - b.depth);
  state.ordered = list;
}

function draw(now) {
  updateAnimation(now);
  drawBackground(now);
  drawOrbitRings();

  const ordered = state.ordered;
  for (const planet of ordered) {
    drawTrail(planet, planet.px, planet.py, now);
    drawBeam(planet, planet.px, planet.py, now);
  }

  drawSun(now);
  for (const planet of ordered) drawPlanet(planet, planet.px, planet.py, now);
  drawAlignmentFlash(now);
}

let rafId = null;

function loop(now) {
  draw(now);
  rafId = requestAnimationFrame(loop);
}

function startLoop() {
  if (rafId === null) {
    lastNow = performance.now();
    rafId = requestAnimationFrame(loop);
  }
}

function stopLoop() {
  if (rafId !== null) {
    cancelAnimationFrame(rafId);
    rafId = null;
  }
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopLoop();
  else startLoop();
});

/* ------------------------------------------------------------------ */
/* Pointer interaction                                                 */
/* ------------------------------------------------------------------ */

let pointer = { x: W / 2, y: H / 2 };

canvas.addEventListener("mousemove", (event) => {
  pointer.x = event.clientX;
  pointer.y = event.clientY;
  let found = null;
  for (const planet of state.planets.values()) {
    if (!planet.sx) continue;
    const dx = event.clientX - planet.sx;
    const dy = event.clientY - planet.sy;
    if (Math.hypot(dx, dy) < planet.size + 8) {
      found = planet;
      break;
    }
  }
  state.hover = found;

  if (found) {
    const status = planetStatus(found);
    const summary = found.error || found.summary;
    tooltip.innerHTML =
      `<span class="tip-head"><span class="tip-name">${escapeHtml(found.agent)}</span>` +
      `<span class="tip-status" style="color:${STATUS_TONE[status]}">${status}</span></span>` +
      (summary ? `<span class="tip-summary">${escapeHtml(summary)}</span>` : "");
    tooltip.style.left = "0px";
    tooltip.style.top = "0px";
    tooltip.classList.remove("hidden");
    const box = tooltip.getBoundingClientRect();
    tooltip.style.left = `${clamp(event.clientX + 16, 8, W - box.width - 8)}px`;
    tooltip.style.top = `${clamp(event.clientY + 16, 8, H - box.height - 8)}px`;
  } else {
    tooltip.classList.add("hidden");
  }
});

canvas.addEventListener("mouseleave", () => {
  state.hover = null;
  tooltip.classList.add("hidden");
});

canvas.addEventListener("click", () => {
  if (state.hover) openDrawer(state.hover.step, state.hover.agent, canvas);
});

canvas.style.cursor = "default";
setInterval(() => {
  canvas.style.cursor = state.hover ? "pointer" : "default";
}, 250);

/* ------------------------------------------------------------------ */
/* Mobile bottom sheet (the wrapper is display:contents on wider screens)*/
/* ------------------------------------------------------------------ */

function syncCmdbarHeight() {
  // The sheet and drawer stack above the measured dock height.
  document.documentElement.style.setProperty("--dock-h", `${cmdbar.offsetHeight}px`);
  syncStage();
}

function setSheet(open) {
  sheet.classList.toggle("open", open);
  sheetToggle.setAttribute("aria-expanded", String(open));
}

function setSheetTab(name) {
  sheet.dataset.tab = name;
  tabRoster.setAttribute("aria-pressed", String(name === "roster"));
  tabFeed.setAttribute("aria-pressed", String(name === "feed"));
}

/* Full-screen result or drawer on small screens; the chrome steps aside. */
function setModal(open) {
  document.body.classList.toggle("modal-open", open);
  syncCmdbarHeight();
}

/* ------------------------------------------------------------------ */
/* Wiring                                                              */
/* ------------------------------------------------------------------ */

runButton.addEventListener("click", startRun);
presets.addEventListener("click", (event) => {
  const chip = event.target.closest("[data-task]");
  if (!chip) return;
  taskInput.value = chip.dataset.task;
  taskInput.focus();
});
taskInput.addEventListener("keydown", (event) => {
  if (event.key === "Enter") startRun();
});
replaySelect.addEventListener("change", (event) => replayRun(event.target.value));
replayPause.addEventListener("click", () => {
  if (replayPlayer.paused) resumeReplay();
  else pauseReplay();
});
replaySpeed.addEventListener("click", toggleReplayRate);
approveBtn.addEventListener("click", () => decide("approve"));
rejectBtn.addEventListener("click", () => decide("reject"));
/* The gate is aria-modal and covers the page: keep Tab on its own buttons
   instead of letting focus reach the controls the scrim blocks. */
document.addEventListener("keydown", (event) => {
  if (event.key !== "Tab" || approvalBox.classList.contains("hidden")) return;
  if (approveBtn.disabled && rejectBtn.disabled) return;
  const items = [approveBtn, rejectBtn];
  const index = items.indexOf(document.activeElement);
  event.preventDefault();
  items[(index + (event.shiftKey ? items.length - 1 : 1)) % items.length].focus();
});
panelClose.addEventListener("click", closeDrawer);
outputClose.addEventListener("click", closeOutput);
outputReplay.addEventListener("click", () => replayRun(state.runId));
pill.addEventListener("click", () => {
  if (state.runId && state.lastResultStatus) showResult(state.lastResultStatus);
});
logToggle.addEventListener("click", () => {
  const hidden = logLines.classList.toggle("hidden");
  logToggle.textContent = hidden ? "SHOW" : "HIDE";
  logToggle.setAttribute("aria-expanded", String(!hidden));
});
sheetToggle.addEventListener("click", () => setSheet(!sheet.classList.contains("open")));
tabRoster.addEventListener("click", () => setSheetTab("roster"));
tabFeed.addEventListener("click", () => setSheetTab("feed"));
window.addEventListener("resize", syncCmdbarHeight);

/* Agent drawer: roster rows are the keyboard path to the canvas drawer. */
rosterRows.addEventListener("click", (event) => {
  const row = event.target.closest(".row[data-agent]");
  if (row) openDrawer(Number(row.dataset.step), row.dataset.agent, row);
});
rosterRows.addEventListener("keydown", (event) => {
  if (event.key !== "Enter" && event.key !== " ") return;
  const row = event.target.closest(".row[data-agent]");
  if (!row) return;
  event.preventDefault();
  openDrawer(Number(row.dataset.step), row.dataset.agent, row);
});
document.addEventListener("keydown", (event) => {
  if (event.key !== "Escape") return;
  closeDrawer();
  setSheet(false);
});

/* ------------------------------------------------------------------ */
/* Boot                                                                */
/* ------------------------------------------------------------------ */

resize();
resetScene();
setSun("idle", "");
syncCmdbarHeight();
/* Header wrapping, dock height and the sheet all move the stage box. */
new ResizeObserver(syncStage).observe(document.getElementById("stage"));
refreshRuns();
connectStream();
startLoop();
</script>
</body>
</html>
